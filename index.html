<script data-k>
'use strict';
// Quelltext der Seite für "Speichern" (ohne vom Viewer eingefügte Elemente)
const SRC_PARTS=(()=>{const h=[...document.head.children].filter(e=>e.hasAttribute('data-k')).map(e=>e.outerHTML).join('\n');
  const b=[...document.body.children].filter(e=>e.hasAttribute('data-k')).map(e=>e.outerHTML).join('\n');return {h,b};})();

const TE=24, DH=110, PAD=20;
const $=s=>document.querySelector(s);
const svg=$('#svg'), world=$('#world'), Lenc=$('#lEnc'), Ldev=$('#lDev'), Lwire=$('#lWire'), Lterm=$('#lTerm'), temp=$('#temp');
const COL={braun:{c:'#8a5a2b',n:'Braun'},schwarz:{c:'#1c1c1e',n:'Schwarz'},grau:{c:'#9a9aa0',n:'Grau'},blau:{c:'#1f6feb',n:'Blau'},gnge:{c:'#2fa14e',n:'Grün-gelb'},pen:{c:'#2fa14e',n:'PEN'}};
const RC={PEN:'pen',PE:'gnge',N:'blau',L1:'braun',L2:'schwarz',L3:'grau',L:'braun'};
const ROLEPRIO=['PEN','PE','N','L1','L2','L3','L'];
const T=(id,label,role,side,fx)=>({id,label,role,side,fx});
const fr=n=>Array.from({length:n},(_,i)=>(2*i+1)/(2*n));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=1)=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:d});

/* ---------- Zeichenhilfen ---------- */
function railBody(w,fill='#fafafa',stroke='#b9b9be'){
  return `<rect x="0" y="0" width="${w}" height="${DH}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="1.2"/>
  <rect x="1.5" y="1.5" width="${w-3}" height="21" rx="3" fill="#e6e6eb"/><rect x="1.5" y="${DH-22.5}" width="${w-3}" height="21" rx="3" fill="#e6e6eb"/>`;
}
function tLabels(d,w,h,fill){const ty=TYPES[d.type];return ty.terms.map(t=>t.label?`<text class="tl" x="${t.fx*w}" y="${t.side==='top'?34:h-27}"${fill?` style="fill:${fill}"`:''}>${t.label}</text>`:'').join('');}
function lever(d,x,y,w,h){const on=!!d.on;return `<g data-kind="lever" data-id="${d.id}" style="cursor:pointer"><rect x="${x-6}" y="${y-5}" width="${w+12}" height="${h+10}" fill="transparent"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="${on?'#2F9E57':'#c7c7cc'}"/><rect x="${x+2}" y="${on?y+2:y+h/2}" width="${w-4}" height="${h/2-2}" rx="2" fill="#fff" opacity=".35"/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" pointer-events="none">${on?'I':'0'}</text></g>`;}
function tripMark(d,w){return d.tripped?`<circle cx="${w-1}" cy="1" r="9" fill="#B4472C" stroke="#fff" stroke-width="1.5"/><text x="${w-1}" y="5.5" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">!</text>`:'';}
function olMark(d,w){return OL[d.id+'#']?`<rect x="2" y="24" width="${w-4}" height="12" rx="3" fill="#C98A1B"/><text x="${w/2}" y="33" text-anchor="middle" font-size="8" font-weight="800" fill="#fff">${w>30?'ÜBERLAST':'ÜL'}</text>`:'';}
function devLabel(d,w){return d.label?`<text class="lbl" x="${w/2}" y="${DH+14}">${esc(d.label)}</text>`:'';}
function cLabel(d,w,y,fill='#3a3a3c'){return `<text x="${w/2}" y="${y}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${fill}" pointer-events="none">${esc(d.label||TYPES[d.type].name)}</text>`;}

/* ---------- Bauteiltypen ---------- */

 hak:{cat:0,name:'Hausanschluss (HAK)',sub:'Hier kommt der Strom ins Haus',w:220,h:200,

  draw(d,{w,h}){let s=`<path d="M110 200 L110 248" stroke="#1c1c1e" stroke-width="12" stroke-linecap="round"/><text x="110" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#3a3a3c">Netz 400/230 V (Erdkabel)</text>

   s+=['L1','L2','L3'].map((p,i)=>{const x=24+i*62, ok=d.fuses[i];return `<rect x="${x}" y="46" width="48" height="84" rx="6" fill="${ok?'#ece5d6':'#d9cfc0'}" stroke="#9e937d"/><rect x="${x+14}" y="40" width="20" height="8" rx="2" fill="#b0b0b5"/><rect x="${x+14}" y="128" width="20" height="8" rx="2" fill="#b0b0b5"/><text x="${x+24}" y="84" text-anchor="middle" font-size="12" font-weight="800" fill="#5a4f3a">63 A</text><text x="${x+24}" y="99" text-anchor="middle" font-size="9" font-weight="700" fill="#7d725c">gG · ${p}</text>${ok?'':`<path d="M${x+6} 54 L${x+42} 122 M${x+42} 54 L${x+6} 122" stroke="#B4472C" stroke-width="4" stroke-linecap="round"/>`}`;}).join('');

   return s+tLabels(d,w,h,'#fff');}},
 zs:{cat:0,name:'Zählerschrank',sub:'Für Hauptschalter und Zähler',enclosure:true,

 spd:{cat:2,name:'Überspannungsschutz',sub:'Gegen Spannungsspitzen, z. B. Blitz',rail:true,te:4,

const FIT=['Summenstromwandler: Alle aktiven Leiter (L und N) laufen durch einen Ringkern. Ist die Summe der Ströme nicht null, löst er aus.','30 mA für Personenschutz, 300 mA für Brandschutz. Abschaltung in der Praxis meist in 20–40 ms.','Pflicht für Steckdosen bis 32 A und für Beleuchtung in Wohnungen (VDE 0100-410).','Schützt nicht vor Überlast oder Kurzschluss L–N, dafür braucht es den LS.','N jedes Stromkreises muss über denselben FI laufen wie sein L.','Prüftaste T regelmäßig drücken, meist halbjährlich.'];
const INFO={
 hak:{e:'Hier kommt der Strom aus dem Erdkabel der Straße ins Haus. Der Kasten gehört dem Netzbetreiber und ist verplombt. Drin sitzen drei dicke Sicherungen, eine pro Außenleiter.',t:['Übergabepunkt vom Netz in die Kundenanlage.','NH-Sicherungen (z. B. 63 A gG) je Außenleiter L1, L2, L3. Keine Hutschienen.','Im TN-C-S-Netz kommt ein PEN-Leiter: Schutz- und Neutralleiter in einem. Er wird später in N und PE aufgeteilt.','Öffnen und Sicherungstausch nur durch Netzbetreiber bzw. eingetragenen Elektroinstallateur.']},
 zs:{e:'Der Schrank für Zähler und Hauptschalter. Auf seinen Hutschienen werden die Geräte festgeklickt.',t:['Aufbau nach VDE-AR-N 4100 (TAR Niederspannung): Anschlussraum mit SLS, Zählerfeld, ggf. Verteilerfeld.','Hutschiene = Tragschiene 35 mm (TS 35). Gerätebreite in Teilungseinheiten: 1 TE = 17,5 mm.','Hier vereinfacht: eine Schiene für SLS und PEN-Aufteilung, eine für den Zähler.']},
 uv:{e:'Verteilt den Strom auf die einzelnen Stromkreise im Haus. Jeder Kreis bekommt seine eigene Sicherung.',t:['Typischer Inhalt: Überspannungsschutz, FI-Schalter, Leitungsschutzschalter (LS), N- und PE-Klemmen.','Ab der PEN-Aufteilung 5 Leiter: L1, L2, L3, N, PE (TN-S).','Pro FI eine eigene N-Klemme, sonst löst der FI aus.','Empfehlung: Stromkreise auf mehrere FIs aufteilen, damit bei einer Auslösung nicht das ganze Haus ausfällt.']},
 sls:{e:'Der Hauptschalter vor dem Zähler. Er ist größer als alle Sicherungen dahinter und springt nur, wenn die es nicht schaffen. Damit schaltest du die ganze Anlage ab.',t:['Selektiver Hauptleitungsschutzschalter, Charakteristik E (z. B. 35 A).','Selektiv: Bei einem Kurzschluss im Stromkreis löst zuerst der kleine LS aus, der SLS bleibt drin.','Nach VDE-AR-N 4100 im Anschlussraum vor dem Zähler vorgesehen, dient auch als Trennstelle.']},
 zaehler:{e:'Zählt, wie viel Energie verbraucht wird. Die Anzeige zeigt hier die aktuelle Leistung aller Verbraucher.',t:['Elektronischer Haushaltszähler (eHZ) bzw. moderne Messeinrichtung, 3-phasig.','Misst Wirkenergie in kWh: Leistung × Zeit, je Außenleiter.','Gehört dem Messstellenbetreiber. Mit Smart-Meter-Gateway wird er zum intelligenten Messsystem.']},
 pen:{e:'Aus dem Netz kommt ein kombinierter Leiter (PEN). Hier wird er in zwei getrennte Leiter aufgeteilt: N (blau) und PE (grün-gelb). Danach dürfen sie nie wieder verbunden werden.',t:['Übergang TN-C → TN-S, zusammen TN-C-S-System.','PEN: grün-gelb mit blauer Markierung, Kupfer mindestens 10 mm².','Werden N und PE danach wieder verbunden, fließt Betriebsstrom über den Schutzleiter und FIs lösen aus.']},
 fi4:{e:'Der FI ist ein Aufpasser, der zählt: Fließt genauso viel Strom zurück wie hinein? Fehlt etwas, weil Strom über einen Menschen oder das Gehäuse in die Erde fließt, schaltet er blitzschnell ab.',t:FIT},
 fi2:{e:'Wie der 4-polige FI, nur für einen einphasigen Abzweig mit L und N.',t:FIT},
 ls1:{e:'Die Sicherung für einen Stromkreis. Ziehen die Geräte zu viel Strom oder gibt es einen Kurzschluss, schaltet er ab, damit die Leitung nicht heiß wird.',t:['Thermischer Auslöser (Bimetall) für Überlast: unter 1,13 × In kein Auslösen, ab 1,45 × In innerhalb 1 Stunde. Hier zeitgerafft.','Magnetischer Auslöser für Kurzschluss: Charakteristik B bei 3–5 × In, in Millisekunden.','Die Größe richtet sich nach der Leitung: 1,5 mm² Kupfer meist B16 (abhängig von Verlegeart), Licht oft B10.','Schützt die Leitung, nicht den Menschen. Dafür ist der FI da.']},
 ls3:{e:'Drei gekoppelte Sicherungen für ein Drehstromgerät wie den Herd. Löst eine aus, schalten alle drei ab.',t:['Dreipolig mit gemeinsamer Schaltwelle.','Herd typisch: 3 × B16 mit 5 × 2,5 mm² (L1, L2, L3, N, PE).','Auslöseverhalten wie beim einpoligen LS.']},
 rcbo:{e:'FI und Sicherung in einem Gerät, für genau einen Stromkreis.',t:['Fehlerstrom-/Leitungsschutzschalter (RCBO).','Vorteil: Ein Fehler schaltet nur diesen einen Kreis ab.','Nachteil: teurer als ein LS hinter einem gemeinsamen FI.']},
 spd:{e:'Fängt Spannungsspitzen ab, zum Beispiel bei einem Blitzeinschlag in der Nähe, und leitet sie zur Erde ab.',t:['Überspannungsschutzgerät (SPD), hier Typ 1+2 (Kombiableiter).','Im Normalbetrieb hochohmig, es fließt kein Strom.','Anschluss an L1–L3, N und PE, mit möglichst kurzen Leitungen.','Bei Neuanlagen nach VDE 0100-443/-534 in der Praxis fast immer gefordert.']},
 nk:{e:'Sammelpunkt für die blauen Neutralleiter. Über N fließt der Strom vom Gerät zurück.',t:['Alle Anschlüsse sind miteinander verbunden.','Pro FI eine eigene N-Klemme: dort nur N von Kreisen, deren L über denselben FI läuft.']},
 pek:{e:'Sammelpunkt für die grün-gelben Schutzleiter. Hat ein Gerät einen Defekt, fließt der Strom hierüber ab statt durch dich.',t:['Verbunden mit dem Hauptpotentialausgleich bzw. der Haupterdungsschiene.','PE wird nie geschaltet und nie durch einen FI geführt.']},
 lampe:{e:'Ein Verbraucher, der Licht macht. Er braucht L (hin) und N (zurück). PE schützt das Metallgehäuse.',t:['60 W, also etwa 0,26 A bei 230 V (I = P / U).','Schutzklasse I: Metallgehäuse an PE.','Beleuchtung in Wohnungen braucht einen 30-mA-FI (VDE 0100-410).']},
 schalter:{e:'Unterbricht die Leitung zur Lampe. Geschaltet wird immer L, nie N.',t:['Ausschalter: trennt den Außenleiter.','Der Draht vom Schalter zur Lampe heißt geschalteter Außenleiter.','Würde N geschaltet, stünde die Lampe auch bei „Aus“ unter Spannung. Gefährlich beim Lampenwechsel.']},
 steckdose:{e:'Hier werden Geräte eingesteckt. Unten wählst du, was gerade dranhängt.',t:['Schutzkontaktsteckdose 16 A / 230 V.','30-mA-FI Pflicht (VDE 0100-410).','Typisch B16 mit 3 × 1,5 mm², je nach Verlegeart und Länge 2,5 mm².','Strom: I = P / 230 V, z. B. 2 kW ≈ 8,7 A.']},
 herd:{e:'Ein großer Verbraucher mit Drehstrom. Jede Kochplatte hängt an einem anderen Außenleiter, so verteilt sich die Last.',t:['Anschluss 400 V 3N~: L1, L2, L3, N, PE.','Hier 3 × 2 kW, also ca. 8,7 A pro Außenleiter.','Fehlt N, liegen die Platten in Reihe an 400 V (Sternpunktverschiebung). Deshalb N nie vergessen.']},
 phs:{e:'Eine Kupferschiene, die die Geräte einer Reihe verbindet – statt viele einzelne Drähte. Sie verteilt L1, L2, L3 der Reihe nach auf die Geräte darunter.',t:['Pins im Raster von 1 TE: L1, L2, L3, L1 … Ein 1-poliger LS bekommt so automatisch den nächsten Außenleiter.','Hier wählbar: oben oder unten, Länge in TE. Sie verbindet nur Anschlüsse von Außenleitern, nicht N.','Querschnitt z. B. 10 mm²; Einspeisung über den FI, der mit auf der Schiene sitzt.','Freie Pins mit Berührungsschutz abdecken.']},
 abzk:{e:'Ein Kasten, in dem eine dicke Zuleitung auf weitere Leitungen aufgeteilt wird, zum Beispiel zur Unterverteilung.',t:['Klemmen für L1, L2, L3, N und PE, bis zum angegebenen Querschnitt (z. B. 16 mm²).','Feuchtraum-Ausführung z. B. IP65.','Jede Klemmengruppe verbindet nur gleiche Leiter.']},
 adose:{e:'Hier werden Leitungen auf Putz abgezweigt, z. B. zu Schalter und Lampe.',t:['Je eine Klemmengruppe für L, N und PE.','Aufputz-Feuchtraumdosen haben z. B. IP54 oder IP55.','Der geschaltete Draht vom Schalter zur Lampe wird darin meist mit einer eigenen Klemme verbunden.']},
 leiste:{e:'Eine längliche LED-Leuchte für feuchte und staubige Räume wie Stall, Keller oder Garage.',t:['Hier 40 W, also etwa 0,17 A.','Schutzart z. B. IP65: staubdicht und strahlwassergeschützt.','In Ställen: gegen Beschädigung geschützt und mit begrenzter Oberflächentemperatur wegen Heu und Staub.']},
 dsteck:{e:'Zwei Steckdosen in einem Rahmen, gemeinsam angeschlossen.',t:['Beide Steckdosen hängen am selben Stromkreis – die Last addiert sich.','Wie jede Steckdose bis 32 A: 30-mA-FI Pflicht (VDE 0100-410).']},
 kombi:{e:'Schalter und Steckdose in einem Gehäuse. Die Steckdose hat immer Strom, der Schalter schaltet z. B. die Lampe.',t:['L kommt einmal an und versorgt Steckdose und Schalter.','Der Ausgang L↑ des Schalters geht zur Lampe.','Häufig als Feuchtraum-Aufputzkombination mit IP44 oder höher.']},
 wago:{e:'Verbindet mehrere Drähte, zum Beispiel in einer Abzweigdose.',t:['Hebelklemme: Alle Anschlüsse sind miteinander verbunden.','Nur gleiche Leiter zusammenklemmen, z. B. nur N.']},

function sz(d){const ty=TYPES[d.type];if(ty.rail)return{w:teOf(d)*TE,h:DH};if(ty.enclosure)return{w:PAD*2+ty.rails[0].len*TE,h:ty.h};return{w:ty.w,h:ty.h};}
function getPos(d){if(d.mount){const e=byId(d.mount.enc);if(e){const r=TYPES[e.type].rails[d.mount.rail];return{x:e.x+PAD+d.mount.slot*TE,y:e.y+r.y-DH/2};}d.mount=null;}return{x:d.x,y:d.y};}
function termOf(key){const [id,tid]=key.split(':');const d=byId(id);if(!d)return null;const t=TYPES[d.type].terms?.find(t=>t.id===tid);return t?{d,t}:null;}
function termAbs(key){const o=termOf(key);if(!o)return null;const p=getPos(o.d),s=sz(o.d);return{x:p.x+o.t.fx*s.w,y:o.t.side==='top'?p.y+12:p.y+s.h-12,side:o.t.side};}
function nm(d){if(!d)return'';const ty=TYPES[d.type];if(d.label)return(ty.unit==='ls'?'Sicherung ':ty.unit==='rcbo'?'FI/LS ':'')+d.label;if(d.type==='sls')return'Hauptschalter';if(d.type==='hak')return'Hausanschluss';if(d.type==='pen')return'Aufteilung PEN';if(ty.unit==='ls')return`Sicherung B${d.rating}`;if(ty.unit==='rcbo')return`FI/LS B${d.rating}`;return ty.name;}

/* ---------- Netzberechnung ---------- */
function closed(d,suf,o){if(o.open&&o.open.includes(d.id+'#'+suf))return false;if(o.structural)return true;if(d.type==='hak')return d.fuses[+suf.slice(1)];return !!d.on;}
function buildNets(o={}){
  if(o.open&&!Array.isArray(o.open))o={...o,open:[o.open]};
  const P={};const find=k=>{if(P[k]===undefined){P[k]=k;return k;}while(P[k]!==k){P[k]=P[P[k]];k=P[k];}return k;};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)P[a]=b;};const src={};
  for(const d of S.items){const ty=TYPES[d.type];if(!ty.terms&&!ty.absEdges)continue;(ty.terms||[]).forEach(t=>find(d.id+':'+t.id));
    const cl=(suf='')=>closed(d,suf,o);
    if(ty.edges&&!(o.excludePen&&d.type==='pen'))for(const [a,b] of ty.edges(d,cl))ty.absEdges?uni(a,b):uni(d.id+':'+a,d.id+':'+b);
    if(d.type==='hak'){['L1','L2','L3'].forEach((p,i)=>{const s=d.id+':S'+i;find(s);src[s]={phase:p};if(cl('f'+i))uni(s,d.id+':'+p);});src[d.id+':PEN']={ground:true};}
    if(!o.noFaults&&d.fault){const L=d.id+':'+ty.lTerm;if(d.fault.kurz)uni(L,d.id+':N');if(d.fault.koerper)uni(L,d.id+':PE');}
  }
  for(const w of S.wires){if(o.excludeWire===w.id)continue;if(!termOf(w.a)||!termOf(w.b))continue;
    if(o.excludePen&&(termOf(w.a).t.role==='PEN'||termOf(w.b).t.role==='PEN'))continue;uni(w.a,w.b);}
  const props={};for(const k in src){const r=find(k);const p=props[r]||(props[r]={phases:new Set(),ground:false});if(src[k].phase)p.phases.add(src[k].phase);if(src[k].ground)p.ground=true;}
  const empty={phases:new Set(),ground:false};
  return{find,get:k=>props[find(k)]||empty,roots:()=>Object.entries(props)};
}
const isShort=p=>p.phases.size>1||(p.phases.size>0&&p.ground);
const shorts=n=>n.roots().filter(([,p])=>isShort(p));
function loadEls(all){const out=[];for(const d of S.items){const ty=TYPES[d.type];if(!ty.loads)continue;for(const [L,N,P] of ty.loads(d,all))out.push({d,term:L,L:d.id+':'+L,N:d.id+':'+N,P});}return out;}
function powered(e,n){const l=n.get(e.L),nn=n.get(e.N);return l.phases.size===1&&!l.ground&&nn.ground&&nn.phases.size===0;}
function units(){const u=[];for(const d of S.items){const ty=TYPES[d.type];
  if(d.type==='hak')[0,1,2].forEach(i=>u.push({id:d.id+'#f'+i,d,kind:'nh',rating:63,pole:i,closed:d.fuses[i]}));
  else if(ty.unit)u.push({id:d.id+'#',d,kind:ty.unit,rating:d.rating,idn:d.idn,closed:!!d.on});}return u;}
const isFI=u=>u.kind==='fi'||u.kind==='rcbo';
const isProt=u=>['ls','rcbo','sls','nh'].includes(u.kind);
function uName(u){return u.kind==='nh'?`NH-Sicherung ${['L1','L2','L3'][u.pole]} im HAK`:nm(u.d);}

function trip(u,kind,msg,lvl='err'){if(u.kind==='nh')u.d.fuses[u.pole]=false;else{u.d.on=false;u.d.tripped=kind;}delete OL[u.id];toast(msg,lvl);}
function shortDesc(p){const ph=[...p.phases];return ph.length>1?ph.join(' ↔ '):`${ph[0]} ↔ N/PE`;}

function simulate(){
  for(let it=0;it<40;it++){
    const n=buildNets();const sh=shorts(n);
    if(sh.length){
      let done=false;
      for(const d of S.items){if(!d.fault?.koerper)continue;const Lk=d.id+':'+TYPES[d.type].lTerm;const p=n.get(Lk);if(!(p.ground&&p.phases.size))continue;
        const f=units().filter(u=>u.closed&&isFI(u)).filter(u=>!buildNets({open:u.id}).get(Lk).phases.size).sort((a,b)=>a.idn-b.idn)[0];
        if(f){trip(f,'Fehlerstrom',`<b>${esc(uName(f))} hat ausgelöst</b>Körperschluss an ${esc(nm(d))}: Der Strom fließt über den Schutzleiter (PE) ab statt über N zurück. Die Differenz ist größer als ${f.idn} mA, also schaltet der FI in ca. 20–40 ms ab.`,'warn');done=true;break;}}
      if(done)continue;
      const c=units().filter(u=>u.closed&&isProt(u)).map(u=>({u,k:shorts(buildNets({open:u.id})).length})).filter(x=>x.k<sh.length).sort((a,b)=>a.u.rating-b.u.rating||a.k-b.k);
      if(!c.length)break;
      const u=c[0].u;const ks=S.items.some(d=>d.fault?.koerper&&n.get(d.id+':PE').phases.size);
      let m=`<b>${esc(uName(u))} hat ausgelöst</b>Kurzschluss (${shortDesc(sh[0][1])}). `;
      if(u.kind==='nh')m+='Die Sicherung im HAK ist durchgebrannt. Tauschen darf sie nur der Netzbetreiber bzw. ein eingetragener Elektroinstallateur.';
      else if(u.kind==='sls')m+='Keine kleinere Sicherung konnte abschalten. Der Kurzschluss liegt vor den Sicherungen oder der Kreis hat keine Sicherung.';
      else m+='Der magnetische Schnellauslöser der Sicherung hat in wenigen Millisekunden abgeschaltet. Der Hauptschalter davor bleibt drin.';
      if(ks&&u.kind!=='nh')m+=' Hinweis: Ohne FI wird der Körperschluss nur über den hohen Kurzschlussstrom L–PE abgeschaltet.';
      trip(u,'Kurzschluss',m);continue;
    }
    let tr=false;const els=loadEls().filter(e=>powered(e,n));
    outer:for(const f of units().filter(u=>u.closed&&isFI(u))){const n2=buildNets({open:f.id});
      for(const e of els){const lDep=!n2.get(e.L).phases.size,nDep=!n2.get(e.N).ground;
        if(lDep!==nDep){trip(f,'Fehlerstrom',`<b>${esc(uName(f))} hat ausgelöst</b>Bei ${esc(nm(e.d))} fließt über L und N nicht derselbe Strom durch diesen FI. Ursache: ${lDep?'N läuft nicht über diesen FI (andere N-Klemme, vor dem FI abgegriffen oder mit PE verbunden).':'N läuft über diesen FI, L aber nicht.'}`,'warn');tr=true;break outer;}}}
    if(tr)continue;break;
  }
  computeRT();
}
function computeRT(){
  const n=buildNets();RT={n,flow:new Set(),powered:new Map(),cur:new Map(),housing:new Set(),P:0};
  const els=loadEls().filter(e=>powered(e,n));
  for(const e of els){RT.P+=e.P;if(!RT.powered.has(e.d.id))RT.powered.set(e.d.id,[]);RT.powered.get(e.d.id).push(e);}
  const now=Date.now();const seen=new Set();
  for(const u of units().filter(u=>u.closed&&isProt(u))){const n2=buildNets({open:u.id});const ph={};
    for(const e of els)if(e.P>0&&!powered(e,n2)){const p=[...n.get(e.L).phases][0];ph[p]=(ph[p]||0)+e.P/230;}
    const I=Math.max(0,...Object.values(ph));RT.cur.set(u.id,I);const r=I/u.rating;
    if(r>1.13){seen.add(u.id);if(!OL[u.id]||Math.abs(OL[u.id].I-I)>.01)OL[u.id]={I,r,until:now+(r>=1.45?3000:8000)};}}
  for(const id in OL)if(!seen.has(id))delete OL[id];
  for(const w of S.wires){const n2=buildNets({excludeWire:w.id});if(els.some(e=>e.P>0&&!powered(e,n2)))RT.flow.add(w.id);}
  for(const d of S.items)if(d.fault?.koerper){const p=n.get(d.id+':PE');if(p.phases.size&&!p.ground)RT.housing.add(d.id);}
  if(Object.keys(OL).length&&!tick)tick=setInterval(onTick,250);
  if(!Object.keys(OL).length&&tick){clearInterval(tick);tick=null;}
}
function onTick(){const now=Date.now();
  for(const id in OL){if(now>=OL[id].until){const o=OL[id];const u=units().find(x=>x.id===id);delete OL[id];
      if(u&&u.closed)trip(u,'Überlast',`<b>${esc(uName(u))} hat ausgelöst</b>Überlast: ${fmt(o.I)} A bei ${u.rating} A Nennstrom (${Math.round(o.r*100)} %). Der thermische Auslöser (Bimetall) hat sich erwärmt. In echt dauert das Sekunden bis Minuten, hier ist die Zeit gerafft.`);
      changed();return;}}
  const el=document.getElementById('olc');if(el&&S.sel){const o=OL[S.sel.id+'#'];if(o)el.textContent=Math.max(0,Math.ceil((o.until-now)/1000))+' s';}
}

/* ---------- Prüfmodus ---------- */
function check(){
  const R=[];const add=(lvl,txt,ids=[])=>R.push({lvl,txt,ids});
  const sN=buildNets({structural:true,noFaults:true});const NU={};const nu=u=>NU[u.id]||(NU[u.id]=buildNets({structural:true,noFaults:true,open:u.id}));
  for(const [r,p] of shorts(sN)){const ws=S.wires.filter(w=>sN.find(w.a)===r).map(w=>'w:'+w.id);add('err',`Kurzschluss in der Verdrahtung: ${shortDesc(p)} sind direkt verbunden. Beim Einschalten löst die Sicherung sofort aus.`,ws);}
  const sX=buildNets({structural:true,noFaults:true,excludePen:true});const g={};
  for(const d of S.items){if(d.type==='pen'||d.type==='hak')continue;for(const t of TYPES[d.type].terms||[]){if(t.role!=='N'&&t.role!=='PE')continue;const r=sX.find(d.id+':'+t.id);(g[r]||(g[r]={N:new Set(),PE:new Set()}))[t.role].add(d.id);}}
  for(const r in g)if(g[r].N.size&&g[r].PE.size)add('err','N und PE sind nach der Aufteilung wieder miteinander verbunden. Dann fließt Betriebsstrom über den Schutzleiter, FIs lösen aus.',[...g[r].N,...g[r].PE]);
  const U=units();const fiU=U.filter(isFI),lsU=U.filter(u=>u.kind==='ls'||u.kind==='rcbo'),swU=U.filter(u=>u.kind==='sw');
  const cons=S.items.filter(d=>TYPES[d.type].loads);
  for(const d of cons){const els=loadEls(true).filter(e=>e.d===d);
    if(!S.wires.some(w=>w.a.startsWith(d.id+':')||w.b.startsWith(d.id+':'))){add('warn',`${nm(d)}: noch nicht angeschlossen.`,[d.id]);continue;}
    const noL=els.filter(e=>!sN.get(e.L).phases.size);if(noL.length)add('warn',`${nm(d)}: Außenleiter ${noL.map(e=>e.term).join(', ')} bekommt keine Spannung.`,[d.id]);
    if(!sN.get(d.id+':N').ground)add('warn',`${nm(d)}: Neutralleiter N fehlt, das Gerät bekommt keinen Strom.`,[d.id]);
    const e0=els.find(e=>sN.get(e.L).phases.size);if(!e0||!sN.get(d.id+':N').ground)continue;
    if(!sN.get(d.id+':PE').ground)add('err',`${nm(d)}: Schutzleiter PE fehlt. Bei einem Defekt steht das Metallgehäuse unter Spannung und niemand merkt es – bis jemand es anfasst.`,[d.id]);
    const fi30=fiU.filter(u=>u.idn<=30&&!nu(u).get(e0.L).phases.size);
    if(!fi30.length){if(d.type==='herd')add('hint',`${nm(d)}: kein 30-mA-FI. Für fest angeschlossene Geräte nicht zwingend, aber üblich.`,[d.id]);else add('err',`${nm(d)}: kein 30-mA-FI im Stromkreis. Pflicht für Steckdosen bis 32 A und Beleuchtung in Wohnungen (VDE 0100-410).`,[d.id]);}
    const lsOn=lsU.filter(u=>!nu(u).get(e0.L).phases.size);
    if(!lsOn.length)add('err',`${nm(d)}: keine Sicherung (LS) im Stromkreis. Die Leitung ist nicht gegen Überlast geschützt und könnte heiß werden.`,[d.id]);
    else if(['steckdose','dsteck','kombi'].includes(d.type)&&Math.min(...lsOn.map(u=>u.rating))>16)add('warn',`${nm(d)}: Sicherung größer als 16 A. Bei 1,5 mm² und Schuko-Steckdose ist B16 die Obergrenze.`,[d.id]);
    if(d.type==='herd'&&lsOn.length&&!lsOn.some(u=>u.d.type==='ls3'))add('hint',`${nm(d)}: Für Drehstrom eine 3-polige Sicherung nehmen, damit bei einem Fehler alle drei Außenleiter abschalten.`,[d.id]);
    let fiBad=false;for(const e of els){if(fiBad)break;if(!sN.get(e.L).phases.size||!sN.get(e.N).ground)continue;
      for(const u of fiU){const n2=nu(u);if((!n2.get(e.L).phases.size)!==(!n2.get(e.N).ground)){add('err',`${nm(d)}: L und N laufen nicht über denselben FI (${nm(u.d)}). Der FI löst beim Einschalten aus.`,[d.id,u.d.id]);fiBad=true;break;}}}
    if(d.type==='lampe')for(const u of swU){if(sN.get(d.id+':N').ground&&!nu(u).get(d.id+':N').ground)add('err',`${nm(d)}: Der Schalter schaltet N statt L. Die Lampe steht auch bei „Aus“ unter Spannung.`,[d.id,u.d.id]);}
  }
  for(const w of S.wires){for(const k of [w.a,w.b]){const o=termOf(k);if(!o)continue;const r=o.t.role,c=w.color;let bad=null;
      if(r==='N'&&c!=='blau')bad='Neutralleiter muss blau sein. Blau ist für N reserviert, damit niemand eine Spannung führende Ader für den Rückleiter hält';else if(r==='PE'&&c!=='gnge')bad='Schutzleiter muss grün-gelb sein. Grün-gelb ist ausschließlich PE vorbehalten, nur so ist er eindeutig erkennbar';else if(r==='PEN'&&c!=='pen')bad='PEN muss grün-gelb mit blauer Markierung sein';
      else if(/^L/.test(r)&&['blau','gnge','pen'].includes(c))bad=`Außenleiter (${r}) darf nicht ${COL[c].n.toLowerCase()} sein. Diese Farbe steht für ${c==='blau'?'N':'PE'} – man würde eine Spannung führende Ader für ungefährlich halten`;
      if(bad){add('err',`Leiterfarbe an ${nm(o.d)}: ${bad}.`,['w:'+w.id]);break;}}}
  roomRules(add,sN,nu,fiU);
  const sls=S.items.filter(d=>d.type==='sls');
  if(S.items.some(d=>d.type==='hak')){if(!sls.length)add('warn','Kein Hauptschalter (SLS) vorhanden. Nach VDE-AR-N 4100 gehört er vor den Zähler.');
    else for(const z of S.items.filter(d=>d.type==='zaehler')){const k=z.id+':i1';if(!sN.get(k).phases.size)continue;if(buildNets({structural:true,noFaults:true,open:sls.map(s=>s.id+'#')}).get(k).phases.size)add('warn',`${nm(z)}: Der Hauptschalter (SLS) sitzt nicht vor dem Zähler.`,[z.id]);}
    if(!S.items.some(d=>d.type==='spd'))add('hint','Kein Überspannungsschutz. Bei Neuanlagen nach VDE 0100-443/-534 in der Praxis fast immer gefordert.');}
  for(const d of S.items)if(TYPES[d.type].rail&&!d.mount)add('warn',`${nm(d)} liegt frei und ist nicht auf einer Hutschiene eingerastet.`,[d.id]);
  const cnt={L1:0,L2:0,L3:0};for(const u of lsU.filter(u=>u.d.type!=='ls3')){const k=u.d.id+':'+(u.d.type==='ls1'?'i':'iL');const ph=[...sN.get(k).phases];if(ph.length===1)cnt[ph[0]]++;}
  const vs=Object.values(cnt);if(vs.reduce((a,b)=>a+b,0)>=3&&Math.max(...vs)-Math.min(...vs)>=2)add('hint',`Einphasige Stromkreise ungleich verteilt (L1: ${cnt.L1}, L2: ${cnt.L2}, L3: ${cnt.L3}). Besser gleichmäßig auf die Außenleiter aufteilen.`);
  if(fiU.filter(u=>u.kind==='fi').length===1&&cons.length>=4)add('hint','Alle Kreise hängen an einem FI. Empfehlung: auf mindestens zwei FIs aufteilen, damit bei einer Auslösung nicht alles ausfällt.');
  return R;
}

/* ---------- Rendern ---------- */
function wpath(w){const A=termAbs(w.a),B=termAbs(w.b);if(!A||!B)return'';const da=A.side==='top'?-1:1,db=B.side==='top'?-1:1;const c=Math.min(160,Math.max(34,Math.hypot(A.x-B.x,A.y-B.y)*.35));return `M${A.x},${A.y} C${A.x},${A.y+da*c} ${B.x},${B.y+db*c} ${B.x},${B.y}`;}
function encDraw(d){const ty=TYPES[d.type],{w,h}=sz(d);let s=`<rect width="${w}" height="${h}" rx="14" fill="#fff" stroke="#c7c7cc" stroke-width="1.2" filter="url(#sh)"/><text x="16" y="${h-13}" font-size="14" font-weight="800" fill="#1c1c1e">${esc(d.label||ty.name)}</text>`;
  ty.rails.forEach(r=>{s+=`<text x="${PAD}" y="${r.y-DH/2-8}" font-size="9.5" font-weight="600" fill="#8e8e93">${esc(r.label)}</text><rect x="${PAD-8}" y="${r.y-9}" width="${r.len*TE+16}" height="18" rx="2" fill="url(#rail)" stroke="#9a9aa0" stroke-width=".8"/>`;
    for(let i=0;i<=r.len;i++)s+=`<rect x="${PAD+i*TE-1.5}" y="${r.y-3}" width="3" height="6" rx="1" fill="#8e8e93" opacity=".6"/>`;});
  return s;}
function markBox(d){const m=MARK[d.id];if(!m)return'';const s=sz(d);const c=m==='err'?'#B4472C':'#C98A1B';return `<rect x="-3" y="-3" width="${s.w+6}" height="${s.h+6}" rx="8" fill="${c}" fill-opacity=".07" stroke="${c}" stroke-width="2.5" stroke-dasharray="${m==='err'?'0':'6 4'}" pointer-events="none"/>`;}
function selBox(d){const s=sz(d);return `<rect x="-5" y="-5" width="${s.w+10}" height="${s.h+10}" rx="9" fill="none" stroke="#1A1A1A" stroke-width="2.5" pointer-events="none"/>`;}
function render(){
  if(VIEW==='plan'){renderPlan();return;}
  const sel=S.sel;let se='',sd='',sw='',st='';
  const drag=act&&act.moved&&act.kind==='item'?act.id:null;
  for(const d of S.items){const ty=TYPES[d.type];if(!ty.enclosure)continue;const p=getPos(d);se+=`<g data-kind="item" data-id="${d.id}" transform="translate(${p.x},${p.y})">${encDraw(d)}${sel?.kind==='item'&&sel.id===d.id?selBox(d):''}</g>`;}
  if(GH){const e=byId(GH.enc);if(e){const r=TYPES[e.type].rails[GH.rail];se+=`<rect x="${e.x+PAD+GH.slot*TE}" y="${e.y+r.y-DH/2}" width="${GH.te*TE}" height="${DH}" rx="5" fill="#1A1A1A" opacity=".18" stroke="#1A1A1A" stroke-dasharray="5 4" stroke-width="2"/>`;}}
  const devs=S.items.filter(d=>!TYPES[d.type].enclosure).sort((a,b)=>((a.id===drag)-(b.id===drag))||((!!TYPES[a.type].overlay)-(!!TYPES[b.type].overlay)));
  pathCheck();const gt=guideTargets();
  for(const d of devs){const p=getPos(d),s=sz(d);const dm=PATH&&!PATH.devs.has(d.id);const gb=G&&gt.box===d.id;sd+=`<g data-kind="item" data-id="${d.id}" transform="translate(${p.x},${p.y})"${dm?' class="dim"':''}>${gb?`<rect x="-8" y="-8" width="${s.w+16}" height="${s.h+16}" rx="12" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>`:''}${TYPES[d.type].draw(d,s)}${markBox(d)}${sel?.kind==='item'&&sel.id===d.id?selBox(d):''}</g>`;}
  for(const w of S.wires){const p=wpath(w);if(!p)continue;const live=RT.n&&RT.n.get(w.a).phases.size>0;const c=COL[w.color]||COL.braun;const isSel=sel?.kind==='wire'&&sel.id===w.id;

  modal(h);}
function openHelp(){modal(`<div class="mh"><h2>Hilfe</h2><button class="btn" data-act="mclose">Schließen</button></div><div class="help">
<h3>Einstieg</h3><ul><li><b>Geführt aufbauen</b> (unter „Mehr“): Schritt für Schritt einen Lichtkreis verdrahten. Die zwei Anschlüsse jedes Schritts leuchten auf.</li><li><b>Weg des Stroms</b>: Lampe, Steckdose oder Herd antippen – der Weg vom Hausanschluss bis zum Verbraucher wird hervorgehoben.</li><li>Die großen Zahlen 1–4 auf der Fläche zeigen die Reihenfolge: Hausanschluss → Zählerschrank → Unterverteilung → Verbraucher.</li></ul>
<h3>Grundriss</h3><ul><li>Oben auf <b>Grundriss</b> umschalten. Unten wählst du das Werkzeug: <b>Raum ▭</b> aufziehen (rastet auf 0,5 m) oder <b>Raum mit Ecken</b> für jede Form, Ecke für Ecke.</li><li>Raum antippen: Name, Raumart und Maße ändern. Ecken ziehen ändert die Form.</li><li><b>Geräte</b> zeigt alles, was noch nicht im Grundriss steht. Ein Gerät, das du in einen Raum ziehst, bekommt diesen Raum automatisch.</li><li><b>Kabelkanal</b> und <b>Leitung</b> zeichnest du Punkt für Punkt. Eine Leitung ordnest du einer Sicherung zu, ihre Länge geht in die Doku.</li><li><b>Etagen</b>: Oben links wechselst du zwischen Keller, EG, OG … Unter „Etagen“ legst du weitere an und stellst die Geschosshöhe ein. Die Etage darunter scheint blass durch.</li><li><b>Steigleitung</b>: Stelle antippen, an der die Leitung durch die Decke geht, dann Ziel-Etage wählen. Zeichnest du eine Leitung auf beiden Etagen bis zu diesem Symbol, zählt die Höhe automatisch zur Länge.</li><li><b>Gebäude</b> zeigt alle Etagen von der Seite – mit Hausanschluss, Verteilungen und Steigleitungen.</li><li>Die Raumart bringt Regeln mit, z. B. Bad oder Stall. „Prüfen“ meldet fehlende FI oder zu niedrige Schutzart.</li></ul>
<h3>Aufbauen</h3><ul><li><b>Bauteile</b> antippen und Gerät wählen. Hutschienengeräte rasten automatisch ein: SLS, Zähler und PEN-Aufteilung im Zählerschrank, der Rest in der Unterverteilung.</li><li>Bauteil ziehen zum Verschieben. Über einer Hutschiene zeigt ein blauer Rahmen, wo es einrastet. Ziehst du einen Schrank, wandert alles darin mit.</li></ul>
<h3>Verbinden</h3><ul><li>Vom Anschluss (Punkt) zum anderen Anschluss ziehen – oder ersten Punkt antippen, dann den zweiten.</li><li>Die Aderfarbe wird passend gewählt. Leitung antippen zum Ändern oder Löschen.</li><li>Gelb leuchtende Punkte und Leitungen führen Spannung. Weiße laufende Striche zeigen, wo Strom fließt.</li></ul>
<h3>Schalten und Fehler</h3><ul><li>Hebel antippen schaltet ein und aus. Ausgelöste Geräte zeigen ein rotes Ausrufezeichen.</li><li>Bei Lampe, Steckdose und Herd kannst du Kurzschluss und Körperschluss auslösen. Bei der Steckdose wählst du die Last, damit testest du Überlast.</li><li><b>Prüfen</b> findet typische Verdrahtungsfehler.</li></ul>
<h3>Fehler sofort sehen</h3><ul><li>Nach jedem Schritt wird geprüft. Ein Fehler wird sofort gemeldet – mit Grund – und das Teil rot markiert. Orange gestrichelt heißt: noch unvollständig.</li><li>Der Knopf oben zeigt den Stand: grün „Alles korrekt“, rot mit Anzahl der Fehler. Antippen zeigt die Liste.</li></ul>
<h3>Messen und Rückgängig</h3><ul><li><b>Messen</b> (unter „Mehr“): zwei Anschlüsse antippen, das Messgerät zeigt 0, 230 oder 400 V – wie ein zweipoliger Spannungsprüfer.</li><li><b>↶ Zurück</b> nimmt den letzten Schritt zurück.</li></ul>
<h3>Dokumentation</h3><ul><li><b>Doku</b>: Kundendaten eintragen, Räume und Kleinmaterial ergänzen. Stromkreisliste, Materialliste und Schaltplan entstehen automatisch.</li><li>Leitungstyp und Länge trägst du bei der jeweiligen Sicherung ein, Räume beim Verbraucher.</li><li><b>Drucken / PDF</b> erzeugt das Dokument, <b>Materialliste CSV</b> öffnet sich in Excel.</li></ul>
<h3>Ansicht, Speichern, Teilen</h3><ul><li>Zwei Finger: zoomen. Leere Fläche ziehen: verschieben.</li><li>Gespeichert wird automatisch auf diesem Gerät. <b>Mehr → Projekt → Exportieren</b> sichert einen Aufbau als Datei, z. B. pro Kunde.</li><li><b>Mehr → Teilen</b> zeigt den Link zur Webseite.</li></ul>
<h3>Vereinfachungen</h3><ul><li>Auslösezeiten bei Überlast sind gerafft. Ströme werden aus der Nennleistung berechnet, Leitungsquerschnitte und Schleifenimpedanz sind nicht simuliert.</li><li>Lernwerkzeug: Arbeiten am HAK, Zählerschrank und an der Unterverteilung gehören in die Hände einer Elektrofachkraft.</li></ul></div>`);}

function lichtkreis(withWires){S={items:[],wires:[],nid:1,rooms:['Flur'],doc:S.doc||{},extras:[],plan:emptyPlan()};VSET('schema');OL={};pend=null;LIVEQ=true;MA=MB=null;FREE=false;
  const A=(t,p)=>{const d=newItem(t,p);S.items.push(d);return d;};
  const hak=A('hak',{x:40,y:100}),zs=A('zs',{x:320,y:40}),uv=A('uv',{x:640,y:40});

  if(withWires)for(const st of GSTEPS)if(st.a){const ka=stepKey(st.a,st.b),kb=stepKey(st.b,st.a);const ra=termOf(ka).t.role,rb=termOf(kb).t.role;let c='braun';for(const r of ROLEPRIO)if(ra===r||rb===r){c=RC[r];break;}if(st.b[0]==='lam'&&st.b[1]==='L')c='schwarz';S.wires.push({id:'w'+(S.nid++),a:ka,b:kb,color:c});}}

function volt(a,b){const n=buildNets();if(n.find(a)===n.find(b))return{v:0,t:'Beide Punkte sind direkt miteinander verbunden.'};

  if(!pa||!pb)return{v:null,t:'Kein Messwert: Mindestens ein Punkt hat keine Verbindung zum Netz (Leiter offen oder abgeschaltet).'};
  if(pa==='G'&&pb==='G')return{v:0,t:'N bzw. PE gegeneinander – beide liegen auf Erdpotential.'};
  if(pa==='G'||pb==='G')return{v:230,t:`Außenleiter ${pa==='G'?pb:pa} gegen N/PE: Strangspannung.`};
  if(pa===pb)return{v:0,t:`Beide Punkte hängen an ${pa}.`};

  if(PTOOL==='poly'){if(pts.length<3){toast('Ein Raum braucht mindestens drei Ecken.','info');return;}const r={id:'r'+(S.nid++),fl:FL(),name:nextRoomName(),type:'Wohnraum',pts};S.plan.rooms.push(r);assignRooms();S.sel={kind:'room',id:r.id};}
  else if(PTOOL==='duct'){if(pts.length<2){toast('Ein Kanal braucht mindestens zwei Punkte.','info');return;}const k={id:'k'+(S.nid++),fl:FL(),kind:'Kabelkanal 40×60',pts};S.plan.ducts.push(k);S.sel={kind:'duct',id:k.id};}
  else if(PTOOL==='route'){if(pts.length<2){toast('Eine Leitung braucht mindestens zwei Punkte.','info');return;}
    let ls=null;const C=circuits();for(const p of [pts[pts.length-1],pts[0]]){const id=Object.entries(S.plan.pos).find(([,q])=>q[2]===FL()&&near(q,p))?.[0];const c=id&&C.find(c=>c.cons.some(x=>x.id===id)||c.sws.some(x=>x.id===id));if(c){ls=c.d.id;break;}}
    const k={id:'l'+(S.nid++),fl:FL(),ls,pts};S.plan.routes.push(k);S.sel={kind:'route',id:k.id};const lsd=byId(ls);if(lsd&&!(+lsd.len>0))lsd.len=Math.round(routeLenFor(ls)*10)/10;}
  PDRAW=null;PTOOL='select';temp.setAttribute('d','');ptoolsUI();changed(false);}
function setTool(t){PTOOL=t;PDRAW=['poly','duct','route'].includes(t)?{pts:[]}:null;S.sel=null;temp.setAttribute('d','');renderPanel();ptoolsUI();render();}
function ptoolsUI(){floorsUI();const box=$('#ptools');if(VIEW!=='plan'){box.style.display='none';return;}box.style.display='flex';
  const un=S.items.filter(d=>PLANNABLE(d)&&!S.plan.pos[d.id]).length;const b=(t,l)=>`<button data-act="tool" data-v="${t}" class="${PTOOL===t?'on':''}">${l}</button>`;
  let hint='';const n=PDRAW?PDRAW.pts.length:0;const here=flName(FL());
  if(PTOOL==='select')hint=!S.plan.rooms.some(r=>r.fl===FL())?`Etage „${esc(here)}“ ist noch leer. Tippe auf „Raum ▭“ und zieh ein Rechteck auf – oder „Raum mit Ecken“ für jede andere Form.${flIdx(FL())>0?' Die Etage darunter scheint blass durch.':''}`:'';
  if(PTOOL==='rect')hint='Mit dem Finger ein Rechteck aufziehen. Es rastet auf 0,5 m ein.';
  if(PTOOL==='poly')hint=`Ecken nacheinander antippen (${n} gesetzt). Zum Schließen den ersten Punkt antippen oder „Fertig“.`;
  if(PTOOL==='duct')hint=`Punkte entlang des Kabelkanals antippen (${n} gesetzt), dann „Fertig“.`;
  if(PTOOL==='route')hint=`Weg der Leitung antippen (${n} Punkte${n>1?', '+fmt(polyLen(PDRAW.pts))+' m':''}). Punkte rasten an Geräten und Steigleitungen ein. Über mehrere Etagen: bis zur Steigleitung zeichnen, Etage wechseln, dort weiterzeichnen.`;
  if(PTOOL==='riser')hint='Tippe die Stelle an, an der die Leitung durch die Decke geht. Danach wählst du die Ziel-Etage.';
  const fin=['poly','duct','route'].includes(PTOOL)?`<div><button class="btn" data-act="pfinish">Fertig</button><button class="btn" data-act="pcancel">Abbrechen</button></div>`:['rect','riser'].includes(PTOOL)?`<div><button class="btn" data-act="pcancel">Abbrechen</button></div>`:'';
  box.innerHTML=`${hint?`<div class="hint">${hint}${fin}</div>`:''}<div class="tb">${b('select','Wählen')}${b('rect','Raum ▭')}${b('poly','Raum mit Ecken')}${b('duct','Kabelkanal')}${b('route','Leitung')}${b('riser','Steigleitung')}<button data-act="tray">Geräte${un?` (${un})`:''}</button></div>`;}
function openTray(){const un=S.items.filter(d=>PLANNABLE(d)&&!S.plan.pos[d.id]);
  modal(`<div class="mh"><h2>Geräte platzieren</h2><button class="btn" data-act="mclose">Schließen</button></div>${un.length?`<p style="font-size:14px;color:var(--sub);margin-top:0">Noch nicht im Grundriss. Antippen setzt das Gerät in die Mitte der Etage „${esc(flName(FL()))}“ – dann an seinen Platz ziehen.</p>`+un.map(d=>`<div class="mrow" data-act="place" data-v="${d.id}"><svg width="44" height="44" viewBox="-24 -24 48 48" style="flex:none">${sym(d)}</svg><div><b>${esc(nm(d))}</b><span>${esc(TYPES[d.type].name)}${d.room?' · '+esc(d.room):''}</span></div><span class="ch">›</span></div>`).join(''):'<p style="font-size:15px">Alle Geräte stehen im Grundriss. Neue Geräte fügst du über „Bauteile“ hinzu.</p>'}`);}
function planPanel(s){const P=S.plan;
  if(s.kind==='room'){const r=room(s.id);if(!r)return null;const b=bbox(r.pts),rl=rectLike(r.pts);const devs=S.items.filter(d=>{const p=P.pos[d.id];return p&&p[2]===r.fl&&pip(p,r.pts);});const rule=RTYPES[r.type]||{};
    return `<div class="ph"><div><div class="pt">Raum · ${esc(flName(r.fl))}</div><div class="ps sub">${fmt(polyArea(r.pts))} m² · Umfang ${fmt(polyLen([...r.pts,r.pts[0]]))} m</div></div><button class="btn" data-act="close">Schließen</button></div>
    <div class="col"><div>Name</div><input class="txt" data-act="rname" value="${esc(r.name)}"></div>
    <div class="col"><div>Raumart</div><select class="txt" data-act="rtype">${Object.keys(RTYPES).map(k=>`<option${k===r.type?' selected':''}>${k}</option>`).join('')}</select></div>
    ${rl?`<div class="col"><div>Maße in Metern (Breite × Länge)</div><div class="two"><input class="txt" data-act="rw" inputmode="decimal" value="${fmt(b.x1-b.x0,2)}" aria-label="Breite"><input class="txt" data-act="rl" inputmode="decimal" value="${fmt(b.y1-b.y0,2)}" aria-label="Länge"></div><div style="font-size:12.5px;color:var(--sub);margin-top:5px">Andere Form: Ecken ziehen oder mit „Raum mit Ecken“ zeichnen.</div></div>`:`<div style="font-size:13.5px;color:var(--sub);padding:10px 0;border-bottom:1px solid var(--line)">Freie Form mit ${r.pts.length} Ecken – Ecken ziehen ändert die Form.</div>`}
    <div class="sec">Regeln für diese Raumart</div><div class="expl"><p style="font-size:14.5px">${esc(rule.text||'Allgemeine Regeln: In Wohnungen Steckdosen und Licht über einen 30-mA-FI.')}</p></div>
    <div class="sec">Geräte im Raum</div><div style="font-size:14.5px;margin-top:6px;line-height:1.5">${devs.length?devs.map(d=>esc(nm(d))).join(', '):'Noch keine. Unten über „Geräte“ platzieren.'}</div>
    <div class="actions"><button class="btn red" data-act="rdel">Raum löschen</button></div>`;}
  if(s.kind==='duct'){const k=P.ducts.find(x=>x.id===s.id);if(!k)return null;const kinds=['Kabelkanal 15×15','Kabelkanal 25×40','Kabelkanal 40×60','Kabelkanal 60×110','Installationsrohr M20','Installationsrohr M25'];
    return `<div class="ph"><div><div class="pt">Kabelkanal</div><div class="ps sub">${fmt(polyLen(k.pts))} m · ${esc(flName(k.fl))}</div></div><button class="btn" data-act="close">Schließen</button></div>
    <div class="col"><div>Art</div><select class="txt" data-act="dkind">${kinds.map(x=>`<option${x===k.kind?' selected':''}>${x}</option>`).join('')}</select></div>
    <div class="expl"><p style="font-size:14px;color:#3B362E">Die Länge kommt automatisch in die Materialliste.</p></div><div class="actions"><button class="btn red" data-act="rdel">Kanal löschen</button></div>`;}
  if(s.kind==='route'){const k=P.routes.find(x=>x.id===s.id);if(!k)return null;const C=circuits();const inf=k.ls?routeInfo(k.ls):null;
    return `<div class="ph"><div><div class="pt">Leitungsweg</div><div class="ps sub">${fmt(polyLen(k.pts))} m waagrecht · ${esc(flName(k.fl))}</div></div><button class="btn" data-act="close">Schließen</button></div>
    <div class="col"><div>Gehört zum Stromkreis</div><select class="txt" data-act="rls"><option value="">– noch keiner –</option>${C.map(c=>`<option value="${c.d.id}"${c.d.id===k.ls?' selected':''}>${c.nr} · ${esc(nm(c.d))}</option>`).join('')}</select></div>
    ${inf?`<div class="row"><div class="l">Ganzer Stromkreis<small>${fmt(inf.hor)} m waagrecht${inf.ver?` + ${fmt(inf.ver,2)} m Steigleitung`:''}</small></div><b>${fmt(inf.total)} m</b></div>`:''}
    <div class="expl"><p style="font-size:14px;color:#3B362E">Die Länge wird bei der Sicherung als Vorschlag angeboten. Steigleitungen zählen mit, wenn der Weg auf beiden Etagen am Steigleitungs-Symbol endet. Wege von der Decke zur Dose rechnest du dazu.</p></div><div class="actions"><button class="btn red" data-act="rdel">Leitungsweg löschen</button></div>`;}
  if(s.kind==='riser'){const r=P.risers.find(x=>x.id===s.id);if(!r)return null;const [a,b]=riserSpan(r);const opt=(sel)=>P.floors.map(f=>`<option value="${f.id}"${f.id===sel?' selected':''}>${esc(f.name)}</option>`).join('');
    return `<div class="ph"><div><div class="pt">Steigleitung</div><div class="ps sub">${esc(P.floors[a].name)} → ${esc(P.floors[b].name)} · ${fmt(heightBetween(a,b),2)} m</div></div><button class="btn" data-act="close">Schließen</button></div>
    <div class="col"><div>Von Etage</div><select class="txt" data-act="sfrom">${opt(r.from)}</select></div><div class="col"><div>Bis Etage</div><select class="txt" data-act="sto">${opt(r.to)}</select></div>
    <div class="expl"><p style="font-size:14px;color:#3B362E">Das Symbol erscheint auf allen Etagen dazwischen an derselben Stelle. Leitungswege, die auf zwei Etagen hier enden, bekommen die Höhe automatisch dazu. Die Höhe stellst du unter „Etagen“ ein.</p></div><div class="actions"><button class="btn red" data-act="rdel">Steigleitung löschen</button></div>`;}
  return null;}
function roomRules(add,sN,nu,fiU){const P=S.plan;if(!P.rooms.length)return;const seen=new Set();
  for(const d of S.items){const ty=TYPES[d.type];if(ty.rail||ty.enclosure)continue;const r=roomOfItem(d);if(!r)continue;const rule=RTYPES[r.type];if(!rule)continue;
    if(rule.ip&&d.ip&&!ipOk(d.ip,rule.ip))add('warn',`${nm(d)} im Raum „${r.name}“ (${r.type}): Schutzart ${d.ip} reicht nicht, nötig ist mindestens ${rule.ip}.`,[d.id]);
    if(ty.loads){const Lk=d.id+':'+ty.lTerm;if(sN.get(Lk).phases.size){
      if(rule.fiAll&&!fiU.some(u=>u.idn<=rule.fiAll&&!nu(u).get(Lk).phases.size))add('err',`${nm(d)} im Raum „${r.name}“: In „${r.type}“ müssen alle Stromkreise über einen FI ≤ ${rule.fiAll} mA laufen (${rule.norm}).`,[d.id]);
      if(rule.fi300&&!fiU.some(u=>u.idn<=300&&!nu(u).get(Lk).phases.size))add('warn',`${nm(d)} im Raum „${r.name}“: Für den Brandschutz alle Stromkreise über einen FI ≤ 300 mA führen (${rule.norm}).`,[d.id]);}}
    if(rule.hint&&!seen.has(r.id)){seen.add(r.id);add('hint',`${r.name} (${r.type}): ${rule.hint}`,[]);}}}

/* ---------- Start ---------- */
buildPal();applyView();fillRooms();ptoolsUI();
(()=>{let o=null;try{o=JSON.parse($('#saved').textContent);}catch(_){}let lo=null;try{lo=JSON.parse(localStorage.getItem(LSK));}catch(_){}
  const c=[o,lo].filter(x=>x&&Array.isArray(x.items)&&x.items.length).sort((a,b)=>(b.t||0)-(a.t||0));
  if(!(c[0]&&loadData(c[0]))){simulate();live(true);render();histReset();}})();
</script>
