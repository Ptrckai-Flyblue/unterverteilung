const emptyPlan=()=>({floors:[{id:'f1',name:'Keller',h:2.5},{id:'f2',name:'EG',h:2.75}],cur:'f1',rooms:[],ducts:[],routes:[],risers:[],openings:[],pos:{},z:{}});

let RT={n:null,flow:new Set(),powered:new Map(),cur:new Map(),housing:new Set(),P:0};
let OL={}; let tick=null; let GH=null; let pend=null; let addOff=0;
const V={k:1,tx:40,ty:30};
const byId=id=>S.items.find(i=>i.id===id);
function newItem(type,props={}){const ty=TYPES[type];const d={id:props.id||'i'+(S.nid++),type,x:0,y:0,label:'',on:true,tripped:null,mount:null,...(ty.def||{})};
  if(type==='hak')d.fuses=[true,true,true]; if(ty.faulty)d.fault={kurz:false,koerper:false}; if(ty.loads||type==='schalter')d.room=''; return Object.assign(d,props);}
const teOf=d=>d.span||TYPES[d.type].te;
function sz(d){const ty=TYPES[d.type];if(ty.rail)return{w:teOf(d)*TE,h:DH};if(ty.enclosure)return{w:PAD*2+ty.rails[0].len*TE,h:ty.h};return{w:ty.w,h:ty.h};}
function getPos(d){if(d.mount){const e=byId(d.mount.enc);if(e){const r=TYPES[e.type].rails[d.mount.rail];return{x:e.x+PAD+d.mount.slot*TE,y:e.y+r.y-DH/2};}d.mount=null;}return{x:d.x,y:d.y};}
function termOf(key){const [id,tid]=key.split(':');const d=byId(id);if(!d)return null;const t=TYPES[d.type].terms?.find(t=>t.id===tid);return t?{d,t}:null;}
function termAbs(key){const o=termOf(key);if(!o)return null;const p=getPos(o.d),s=sz(o.d);return{x:p.x+o.t.fx*s.w,y:o.t.side==='top'?p.y+12:p.y+s.h-12,side:o.t.side};}
function nm(d){if(!d)return'';const ty=TYPES[d.type];if(d.label)return(ty.unit==='ls'?'Sicherung ':ty.unit==='rcbo'?'FI/LS ':'')+d.label;if(d.type==='sls')return'Hauptschalter';if(d.type==='hak')return'Hausanschluss';if(d.type==='pen')return'Aufteilung PEN';if(ty.unit==='ls')return`Sicherung B${d.rating}`;if(ty.unit==='rcbo')return`FI/LS B${d.rating}`;return ty.name;}

/* ---------- Netzberechnung ---------- */
function closed(d,suf,o){if(o.open&&o.open.includes(d.id+'#'+suf))return false;if(o.structural)return true;if(d.type==='hak')return d.fuses[+suf.slice(1)];return !!d.on;}
function buildNets(o={}){
  if(o.open&&!Array.isArray(o.open))o={...o,open:[o.open]};
  const P={};const find=k=>{if(P[k]===undefined){P[k]=k;return k;}while(P[k]!==k){P[k]=P[P[k]];k=P[k];}return k;};
  const uni=(a,b)=>{a=find(a);b=find(b);if(a!==b)P[a]=b;};const src={};
  for(const d of S.items){const ty=TYPES[d.type];if(!ty.terms&&!ty.absEdges)continue;(ty.terms||[]).forEach(t=>find(d.id+':'+t.id));
    const cl=(suf='')=>closed(d,suf,o);
    if(ty.edges&&!(o.excludePen&&d.type==='pen'))for(const [a,b] of ty.edges(d,cl))ty.absEdges?uni(a,b):uni(d.id+':'+a,d.id+':'+b);
    if(d.type==='hak'){['L1','L2','L3'].forEach((p,i)=>{const s=d.id+':S'+i;find(s);src[s]={phase:p};if(cl('f'+i))uni(s,d.id+':'+p);});src[d.id+':PEN']={ground:true};}
    if(!o.noFaults&&d.fault){const L=d.id+':'+ty.lTerm;if(d.fault.kurz)uni(L,d.id+':N');if(d.fault.koerper)uni(L,d.id+':PE');}
  }
  for(const w of S.wires){if(o.excludeWire===w.id)continue;if(!termOf(w.a)||!termOf(w.b))continue;
    if(o.excludePen&&(termOf(w.a).t.role==='PEN'||termOf(w.b).t.role==='PEN'))continue;uni(w.a,w.b);}
  const props={};for(const k in src){const r=find(k);const p=props[r]||(props[r]={phases:new Set(),ground:false});if(src[k].phase)p.phases.add(src[k].phase);if(src[k].ground)p.ground=true;}
  const empty={phases:new Set(),ground:false};
  return{find,get:k=>props[find(k)]||empty,roots:()=>Object.entries(props)};
}
const isShort=p=>p.phases.size>1||(p.phases.size>0&&p.ground);
const shorts=n=>n.roots().filter(([,p])=>isShort(p));
function loadEls(all){const out=[];for(const d of S.items){const ty=TYPES[d.type];if(!ty.loads)continue;for(const [L,N,P] of ty.loads(d,all))out.push({d,term:L,L:d.id+':'+L,N:d.id+':'+N,P});}return out;}
function powered(e,n){const l=n.get(e.L),nn=n.get(e.N);return l.phases.size===1&&!l.ground&&nn.ground&&nn.phases.size===0;}
function units(){const u=[];for(const d of S.items){const ty=TYPES[d.type];
  if(d.type==='hak')[0,1,2].forEach(i=>u.push({id:d.id+'#f'+i,d,kind:'nh',rating:63,pole:i,closed:d.fuses[i]}));
  else if(ty.unit)u.push({id:d.id+'#',d,kind:ty.unit,rating:d.rating,idn:d.idn,closed:!!d.on});}return u;}
const isFI=u=>u.kind==='fi'||u.kind==='rcbo';
const isProt=u=>['ls','rcbo','sls','nh'].includes(u.kind);
function uName(u){return u.kind==='nh'?`NH-Sicherung ${['L1','L2','L3'][u.pole]} im HAK`:nm(u.d);}

function trip(u,kind,msg,lvl='err'){if(u.kind==='nh')u.d.fuses[u.pole]=false;else{u.d.on=false;u.d.tripped=kind;}delete OL[u.id];toast(msg,lvl);}
function shortDesc(p){const ph=[...p.phases];return ph.length>1?ph.join(' ↔ '):`${ph[0]} ↔ N/PE`;}

function simulate(){
  for(let it=0;it<40;it++){
    const n=buildNets();const sh=shorts(n);
    if(sh.length){
      let done=false;
      for(const d of S.items){if(!d.fault?.koerper)continue;const Lk=d.id+':'+TYPES[d.type].lTerm;const p=n.get(Lk);if(!(p.ground&&p.phases.size))continue;
        const f=units().filter(u=>u.closed&&isFI(u)).filter(u=>!buildNets({open:u.id}).get(Lk).phases.size).sort((a,b)=>a.idn-b.idn)[0];
        if(f){trip(f,'Fehlerstrom',`<b>${esc(uName(f))} hat ausgelöst</b>Körperschluss an ${esc(nm(d))}: Der Strom fließt über den Schutzleiter (PE) ab statt über N zurück. Die Differenz ist größer als ${f.idn} mA, also schaltet der FI in ca. 20–40 ms ab.`,'warn');done=true;break;}}
      if(done)continue;
      const c=units().filter(u=>u.closed&&isProt(u)).map(u=>({u,k:shorts(buildNets({open:u.id})).length})).filter(x=>x.k<sh.length).sort((a,b)=>a.u.rating-b.u.rating||a.k-b.k);
      if(!c.length)break;
      const u=c[0].u;const ks=S.items.some(d=>d.fault?.koerper&&n.get(d.id+':PE').phases.size);
      let m=`<b>${esc(uName(u))} hat ausgelöst</b>Kurzschluss (${shortDesc(sh[0][1])}). `;
      if(u.kind==='nh')m+='Die Sicherung im HAK ist durchgebrannt. Tauschen darf sie nur der Netzbetreiber bzw. ein eingetragener Elektroinstallateur.';
      else if(u.kind==='sls')m+='Keine kleinere Sicherung konnte abschalten. Der Kurzschluss liegt vor den Sicherungen oder der Kreis hat keine Sicherung.';
      else m+='Der magnetische Schnellauslöser der Sicherung hat in wenigen Millisekunden abgeschaltet. Der Hauptschalter davor bleibt drin.';
      if(ks&&u.kind!=='nh')m+=' Hinweis: Ohne FI wird der Körperschluss nur über den hohen Kurzschlussstrom L–PE abgeschaltet.';
      trip(u,'Kurzschluss',m);continue;
    }
    let tr=false;const els=loadEls().filter(e=>powered(e,n));
    outer:for(const f of units().filter(u=>u.closed&&isFI(u))){const n2=buildNets({open:f.id});
      for(const e of els){const lDep=!n2.get(e.L).phases.size,nDep=!n2.get(e.N).ground;
        if(lDep!==nDep){trip(f,'Fehlerstrom',`<b>${esc(uName(f))} hat ausgelöst</b>Bei ${esc(nm(e.d))} fließt über L und N nicht derselbe Strom durch diesen FI. Ursache: ${lDep?'N läuft nicht über diesen FI (andere N-Klemme, vor dem FI abgegriffen oder mit PE verbunden).':'N läuft über diesen FI, L aber nicht.'}`,'warn');tr=true;break outer;}}}
    if(tr)continue;break;
  }
  computeRT();
}
function computeRT(){
  const n=buildNets();RT={n,flow:new Set(),powered:new Map(),cur:new Map(),housing:new Set(),P:0};
  const els=loadEls().filter(e=>powered(e,n));
  for(const e of els){RT.P+=e.P;if(!RT.powered.has(e.d.id))RT.powered.set(e.d.id,[]);RT.powered.get(e.d.id).push(e);}
  const now=Date.now();const seen=new Set();
  for(const u of units().filter(u=>u.closed&&isProt(u))){const n2=buildNets({open:u.id});const ph={};
    for(const e of els)if(e.P>0&&!powered(e,n2)){const p=[...n.get(e.L).phases][0];ph[p]=(ph[p]||0)+e.P/230;}
    const I=Math.max(0,...Object.values(ph));RT.cur.set(u.id,I);const r=I/u.rating;
    if(r>1.13){seen.add(u.id);if(!OL[u.id]||Math.abs(OL[u.id].I-I)>.01)OL[u.id]={I,r,until:now+(r>=1.45?3000:8000)};}}
  for(const id in OL)if(!seen.has(id))delete OL[id];
  for(const w of S.wires){const n2=buildNets({excludeWire:w.id});if(els.some(e=>e.P>0&&!powered(e,n2)))RT.flow.add(w.id);}
  for(const d of S.items)if(d.fault?.koerper){const p=n.get(d.id+':PE');if(p.phases.size&&!p.ground)RT.housing.add(d.id);}
  if(Object.keys(OL).length&&!tick)tick=setInterval(onTick,250);
  if(!Object.keys(OL).length&&tick){clearInterval(tick);tick=null;}
}
function onTick(){const now=Date.now();
  for(const id in OL){if(now>=OL[id].until){const o=OL[id];const u=units().find(x=>x.id===id);delete OL[id];
      if(u&&u.closed)trip(u,'Überlast',`<b>${esc(uName(u))} hat ausgelöst</b>Überlast: ${fmt(o.I)} A bei ${u.rating} A Nennstrom (${Math.round(o.r*100)} %). Der thermische Auslöser (Bimetall) hat sich erwärmt. In echt dauert das Sekunden bis Minuten, hier ist die Zeit gerafft.`);
      changed();return;}}
  const el=document.getElementById('olc');if(el&&S.sel){const o=OL[S.sel.id+'#'];if(o)el.textContent=Math.max(0,Math.ceil((o.until-now)/1000))+' s';}
}

/* ---------- Prüfmodus ---------- */
function check(){
  const R=[];const add=(lvl,txt,ids=[])=>R.push({lvl,txt,ids});
  const sN=buildNets({structural:true,noFaults:true});const NU={};const nu=u=>NU[u.id]||(NU[u.id]=buildNets({structural:true,noFaults:true,open:u.id}));
  for(const [r,p] of shorts(sN)){const ws=S.wires.filter(w=>sN.find(w.a)===r).map(w=>'w:'+w.id);add('err',`Kurzschluss in der Verdrahtung: ${shortDesc(p)} sind direkt verbunden. Beim Einschalten löst die Sicherung sofort aus.`,ws);}
  const sX=buildNets({structural:true,noFaults:true,excludePen:true});const g={};
  for(const d of S.items){if(d.type==='pen'||d.type==='hak')continue;for(const t of TYPES[d.type].terms||[]){if(t.role!=='N'&&t.role!=='PE')continue;const r=sX.find(d.id+':'+t.id);(g[r]||(g[r]={N:new Set(),PE:new Set()}))[t.role].add(d.id);}}
  for(const r in g)if(g[r].N.size&&g[r].PE.size)add('err','N und PE sind nach der Aufteilung wieder miteinander verbunden. Dann fließt Betriebsstrom über den Schutzleiter, FIs lösen aus.',[...g[r].N,...g[r].PE]);
  const U=units();const fiU=U.filter(isFI),lsU=U.filter(u=>u.kind==='ls'||u.kind==='rcbo'),swU=U.filter(u=>u.kind==='sw');
  const cons=S.items.filter(d=>TYPES[d.type].loads);
  for(const d of cons){const els=loadEls(true).filter(e=>e.d===d);
    if(!S.wires.some(w=>w.a.startsWith(d.id+':')||w.b.startsWith(d.id+':'))){add('warn',`${nm(d)}: noch nicht angeschlossen.`,[d.id]);continue;}
    const noL=els.filter(e=>!sN.get(e.L).phases.size);if(noL.length)add('warn',`${nm(d)}: Außenleiter ${noL.map(e=>e.term).join(', ')} bekommt keine Spannung.`,[d.id]);
    if(!sN.get(d.id+':N').ground)add('warn',`${nm(d)}: Neutralleiter N fehlt, das Gerät bekommt keinen Strom.`,[d.id]);
    const e0=els.find(e=>sN.get(e.L).phases.size);if(!e0||!sN.get(d.id+':N').ground)continue;
    if(!sN.get(d.id+':PE').ground)add('err',`${nm(d)}: Schutzleiter PE fehlt. Bei einem Defekt steht das Metallgehäuse unter Spannung und niemand merkt es – bis jemand es anfasst.`,[d.id]);
    const fi30=fiU.filter(u=>u.idn<=30&&!nu(u).get(e0.L).phases.size);
    if(!fi30.length){if(d.type==='herd')add('hint',`${nm(d)}: kein 30-mA-FI. Für fest angeschlossene Geräte nicht zwingend, aber üblich.`,[d.id]);else add('err',`${nm(d)}: kein 30-mA-FI im Stromkreis. Pflicht für Steckdosen bis 32 A und Beleuchtung in Wohnungen (VDE 0100-410).`,[d.id]);}
    const lsOn=lsU.filter(u=>!nu(u).get(e0.L).phases.size);
    if(!lsOn.length)add('err',`${nm(d)}: keine Sicherung (LS) im Stromkreis. Die Leitung ist nicht gegen Überlast geschützt und könnte heiß werden.`,[d.id]);
    else if(['steckdose','dsteck','kombi'].includes(d.type)&&Math.min(...lsOn.map(u=>u.rating))>16)add('warn',`${nm(d)}: Sicherung größer als 16 A. Bei 1,5 mm² und Schuko-Steckdose ist B16 die Obergrenze.`,[d.id]);
    if(d.type==='herd'&&lsOn.length&&!lsOn.some(u=>u.d.type==='ls3'))add('hint',`${nm(d)}: Für Drehstrom eine 3-polige Sicherung nehmen, damit bei einem Fehler alle drei Außenleiter abschalten.`,[d.id]);
    let fiBad=false;for(const e of els){if(fiBad)break;if(!sN.get(e.L).phases.size||!sN.get(e.N).ground)continue;
      for(const u of fiU){const n2=nu(u);if((!n2.get(e.L).phases.size)!==(!n2.get(e.N).ground)){add('err',`${nm(d)}: L und N laufen nicht über denselben FI (${nm(u.d)}). Der FI löst beim Einschalten aus.`,[d.id,u.d.id]);fiBad=true;break;}}}
    if(d.type==='lampe')for(const u of swU){if(sN.get(d.id+':N').ground&&!nu(u).get(d.id+':N').ground)add('err',`${nm(d)}: Der Schalter schaltet N statt L. Die Lampe steht auch bei „Aus“ unter Spannung.`,[d.id,u.d.id]);}
  }
  for(const w of S.wires){for(const k of [w.a,w.b]){const o=termOf(k);if(!o)continue;const r=o.t.role,c=w.color;let bad=null;
      if(r==='N'&&c!=='blau')bad='Neutralleiter muss blau sein. Blau ist für N reserviert, damit niemand eine Spannung führende Ader für den Rückleiter hält';else if(r==='PE'&&c!=='gnge')bad='Schutzleiter muss grün-gelb sein. Grün-gelb ist ausschließlich PE vorbehalten, nur so ist er eindeutig erkennbar';else if(r==='PEN'&&c!=='pen')bad='PEN muss grün-gelb mit blauer Markierung sein';
      else if(/^L/.test(r)&&['blau','gnge','pen'].includes(c))bad=`Außenleiter (${r}) darf nicht ${COL[c].n.toLowerCase()} sein. Diese Farbe steht für ${c==='blau'?'N':'PE'} – man würde eine Spannung führende Ader für ungefährlich halten`;
      if(bad){add('err',`Leiterfarbe an ${nm(o.d)}: ${bad}.`,['w:'+w.id]);break;}}}
  roomRules(add,sN,nu,fiU);
  const sls=S.items.filter(d=>d.type==='sls');
  if(S.items.some(d=>d.type==='hak')){if(!sls.length)add('warn','Kein Hauptschalter (SLS) vorhanden. Nach VDE-AR-N 4100 gehört er vor den Zähler.');
    else for(const z of S.items.filter(d=>d.type==='zaehler')){const k=z.id+':i1';if(!sN.get(k).phases.size)continue;if(buildNets({structural:true,noFaults:true,open:sls.map(s=>s.id+'#')}).get(k).phases.size)add('warn',`${nm(z)}: Der Hauptschalter (SLS) sitzt nicht vor dem Zähler.`,[z.id]);}
    if(!S.items.some(d=>d.type==='spd'))add('hint','Kein Überspannungsschutz. Bei Neuanlagen nach VDE 0100-443/-534 in der Praxis fast immer gefordert.');}
  for(const d of S.items)if(TYPES[d.type].rail&&!d.mount)add('warn',`${nm(d)} liegt frei und ist nicht auf einer Hutschiene eingerastet.`,[d.id]);
  const cnt={L1:0,L2:0,L3:0};for(const u of lsU.filter(u=>u.d.type!=='ls3')){const k=u.d.id+':'+(u.d.type==='ls1'?'i':'iL');const ph=[...sN.get(k).phases];if(ph.length===1)cnt[ph[0]]++;}
  const vs=Object.values(cnt);if(vs.reduce((a,b)=>a+b,0)>=3&&Math.max(...vs)-Math.min(...vs)>=2)add('hint',`Einphasige Stromkreise ungleich verteilt (L1: ${cnt.L1}, L2: ${cnt.L2}, L3: ${cnt.L3}). Besser gleichmäßig auf die Außenleiter aufteilen.`);
  if(fiU.filter(u=>u.kind==='fi').length===1&&cons.length>=4)add('hint','Alle Kreise hängen an einem FI. Empfehlung: auf mindestens zwei FIs aufteilen, damit bei einer Auslösung nicht alles ausfällt.');
  return R;
}

/* ---------- Rendern ---------- */
function wpath(w){const A=termAbs(w.a),B=termAbs(w.b);if(!A||!B)return'';const da=A.side==='top'?-1:1,db=B.side==='top'?-1:1;const c=Math.min(160,Math.max(34,Math.hypot(A.x-B.x,A.y-B.y)*.35));return `M${A.x},${A.y} C${A.x},${A.y+da*c} ${B.x},${B.y+db*c} ${B.x},${B.y}`;}
function encDraw(d){const ty=TYPES[d.type],{w,h}=sz(d);let s=`<rect width="${w}" height="${h}" rx="14" fill="#fff" stroke="#c7c7cc" stroke-width="1.2" filter="url(#sh)"/><text x="16" y="${h-13}" font-size="14" font-weight="800" fill="#1c1c1e">${esc(d.label||ty.name)}</text>`;
  ty.rails.forEach(r=>{s+=`<text x="${PAD}" y="${r.y-DH/2-8}" font-size="9.5" font-weight="600" fill="#8e8e93">${esc(r.label)}</text><rect x="${PAD-8}" y="${r.y-9}" width="${r.len*TE+16}" height="18" rx="2" fill="url(#rail)" stroke="#9a9aa0" stroke-width=".8"/>`;
    for(let i=0;i<=r.len;i++)s+=`<rect x="${PAD+i*TE-1.5}" y="${r.y-3}" width="3" height="6" rx="1" fill="#8e8e93" opacity=".6"/>`;});
  return s;}
function markBox(d){const m=MARK[d.id];if(!m)return'';const s=sz(d);const c=m==='err'?'#B4472C':'#C98A1B';return `<rect x="-3" y="-3" width="${s.w+6}" height="${s.h+6}" rx="8" fill="${c}" fill-opacity=".07" stroke="${c}" stroke-width="2.5" stroke-dasharray="${m==='err'?'0':'6 4'}" pointer-events="none"/>`;}
function selBox(d){const s=sz(d);return `<rect x="-5" y="-5" width="${s.w+10}" height="${s.h+10}" rx="9" fill="none" stroke="#1A1A1A" stroke-width="2.5" pointer-events="none"/>`;}
function render(){
  if(VIEW==='plan'){renderPlan();return;}
  if(VIEW==='3d'){render3d();return;}
  const sel=S.sel;let se='',sd='',sw='',st='';
  const drag=act&&act.moved&&act.kind==='item'?act.id:null;
  for(const d of S.items){const ty=TYPES[d.type];if(!ty.enclosure)continue;const p=getPos(d);se+=`<g data-kind="item" data-id="${d.id}" transform="translate(${p.x},${p.y})">${encDraw(d)}${sel?.kind==='item'&&sel.id===d.id?selBox(d):''}</g>`;}
  if(GH){const e=byId(GH.enc);if(e){const r=TYPES[e.type].rails[GH.rail];se+=`<rect x="${e.x+PAD+GH.slot*TE}" y="${e.y+r.y-DH/2}" width="${GH.te*TE}" height="${DH}" rx="5" fill="#1A1A1A" opacity=".18" stroke="#1A1A1A" stroke-dasharray="5 4" stroke-width="2"/>`;}}
  const devs=S.items.filter(d=>!TYPES[d.type].enclosure).sort((a,b)=>((a.id===drag)-(b.id===drag))||((!!TYPES[a.type].overlay)-(!!TYPES[b.type].overlay)));
  pathCheck();const gt=guideTargets();
  for(const d of devs){const p=getPos(d),s=sz(d);const dm=PATH&&!PATH.devs.has(d.id);const gb=G&&gt.box===d.id;sd+=`<g data-kind="item" data-id="${d.id}" transform="translate(${p.x},${p.y})"${dm?' class="dim"':''}>${gb?`<rect x="-8" y="-8" width="${s.w+16}" height="${s.h+16}" rx="12" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-dasharray="7 5" pointer-events="none"/>`:''}${TYPES[d.type].draw(d,s)}${markBox(d)}${sel?.kind==='item'&&sel.id===d.id?selBox(d):''}</g>`;}
  for(const w of S.wires){const p=wpath(w);if(!p)continue;const live=RT.n&&RT.n.get(w.a).phases.size>0;const c=COL[w.color]||COL.braun;const isSel=sel?.kind==='wire'&&sel.id===w.id;
    sw+=`<g${PATH&&!PATH.wires.has(w.id)?' class="dim"':''}>${MARK['w:'+w.id]?`<path d="${p}" fill="none" stroke="#B4472C" stroke-width="13" opacity=".35" stroke-linecap="round"/>`:''}${isSel?`<path d="${p}" fill="none" stroke="#1A1A1A" stroke-width="12" opacity=".45" stroke-linecap="round"/>`:''}${live&&!RT.flow.has(w.id)?`<path class="glow" d="${p}"/>`:''}<path class="wire" d="${p}" stroke="${c.c}" stroke-width="4.5"/>`;
    if(w.color==='gnge'||w.color==='pen')sw+=`<path class="wire" d="${p}" stroke="#f5d10a" stroke-width="4.5" stroke-dasharray="8 8"/>`;
    if(w.color==='pen'){const A=termAbs(w.a),B=termAbs(w.b);sw+=`<circle cx="${A.x}" cy="${A.y+(A.side==='top'?-12:12)}" r="4.5" fill="#1f6feb"/><circle cx="${B.x}" cy="${B.y+(B.side==='top'?-12:12)}" r="4.5" fill="#1f6feb"/>`;}
    if(RT.flow.has(w.id))sw+=`<path class="flow" d="${p}"/>`;
    sw+=`<path d="${p}" fill="none" stroke="transparent" stroke-width="18" data-kind="wire" data-id="${w.id}"/></g>`;}
  if(gt.keys.length===2){const A=termAbs(gt.keys[0]),B=termAbs(gt.keys[1]);if(A&&B)sw+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#1A1A1A" stroke-width="2.5" stroke-dasharray="3 7" stroke-linecap="round" opacity=".55" pointer-events="none"/>`;}
  sw+=stepLabels();
  for(const d of S.items){const ty=TYPES[d.type];if(!ty.terms)continue;for(const t of ty.terms){const k=d.id+':'+t.id;const a=termAbs(k);const live=RT.n&&RT.n.get(k).phases.size>0;
    st+=`<g data-kind="term" data-key="${k}" transform="translate(${a.x},${a.y})"><circle r="13" fill="transparent"/>${gt.keys.includes(k)?`<circle class="gpulse" r="9"/><circle r="11" fill="none" stroke="#1A1A1A" stroke-width="3"/><g transform="translate(0,${termAbs(k).side==='top'?-26:26})"><circle r="10" fill="#1A1A1A"/><text y="4.5" text-anchor="middle" font-size="12" font-weight="800" fill="#F6F1E9">${gt.keys.indexOf(k)+1}</text></g>`:''}<circle class="dot${live?' live':''}${pend===k?' pend':''}" r="${pend===k?7:5.5}"/>${MEAS&&(MA===k||MB===k)?`<circle r="10" fill="none" stroke="#1A1A1A" stroke-width="3"/><text y="-14" text-anchor="middle" font-size="11" font-weight="800" fill="#1A1A1A">${MA===k?'A':'B'}</text>`:''}</g>`;}}
  Lenc.innerHTML=se;Ldev.innerHTML=sd;Lwire.innerHTML=sw;Lterm.innerHTML=st;
  $('#empty').style.display=S.items.length||FREE||G?'none':'block';
}
let raf=0;const req=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;render();});};
function applyView(){world.setAttribute('transform',`translate(${V.tx},${V.ty}) scale(${V.k})`);}

/* ---------- Hutschiene ---------- */
function occ(eid,ri,except){const e=byId(eid);const len=TYPES[e.type].rails[ri].len;const a=new Array(len).fill(false);
  for(const d of S.items)if(d.mount&&d.mount.enc===eid&&d.mount.rail===ri&&d.id!==except&&!TYPES[d.type].overlay)for(let i=0;i<teOf(d);i++)a[d.mount.slot+i]=true;return a;}
const freeAt=(a,s,te)=>{for(let i=0;i<te;i++)if(a[s+i])return false;return true;};
function findMount(d){const ty=TYPES[d.type];if(!ty.rail)return null;const te=teOf(d),ov=!!ty.overlay;const cx=d.x+te*TE/2,cy=d.y+DH/2;let best=null;
  for(const e of S.items.filter(i=>TYPES[i.type].enclosure))TYPES[e.type].rails.forEach((r,ri)=>{const x0=e.x+PAD,ry=e.y+r.y;
    if(Math.abs(cy-ry)>75||cx<x0-30||cx>x0+r.len*TE+30||te>r.len)return;
    const want=clamp(Math.round((d.x-x0)/TE),0,r.len-te);const a=ov?new Array(r.len).fill(false):occ(e.id,ri,d.id);let f=null;
    for(let k=0;k<r.len&&f===null;k++)for(const s of [want-k,want+k]){if(s<0||s>r.len-te)continue;if(freeAt(a,s,te)){f=s;break;}}
    if(f===null)return;const dist=Math.abs(cy-ry)+Math.abs(f-want)*TE;if(!best||dist<best.dist)best={enc:e.id,rail:ri,slot:f,dist,te};});
  return best;}
function firstFree(e,te){const rails=TYPES[e.type].rails;for(let ri=0;ri<rails.length;ri++){const a=occ(e.id,ri,null);for(let s=0;s<=rails[ri].len-te;s++)if(freeAt(a,s,te))return{enc:e.id,rail:ri,slot:s};}return null;}

/* ---------- Bedienung ---------- */
function toWorld(cx,cy){const r=svg.getBoundingClientRect();return{x:(cx-r.left-V.tx)/V.k,y:(cy-r.top-V.ty)/V.k};}
const ptrs=new Map();let act=null;
svg.addEventListener('pointerdown',e=>{
  try{svg.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){startPinch();return;}if(ptrs.size>2)return;
  const el=e.target.closest('[data-kind]');const kind=el?el.dataset.kind:'bg';const w=toWorld(e.clientX,e.clientY);
  if(VIEW==='plan'){planDown(e,el,w);return;}
  if(VIEW==='3d'){act={v3:true,pan:e.button===1||e.button===2||e.shiftKey,yaw0:R3.yaw,pitch0:R3.pitch,kind:el?el.dataset.kind:'bg',id:el?.dataset.id,i:el?.dataset.i,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId,v0:{tx:V.tx,ty:V.ty}};return;}
  act={kind,id:el?.dataset.id,key:el?.dataset.key,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId,v0:{tx:V.tx,ty:V.ty}};
  if(['item','lever','test'].includes(kind)){const d=byId(act.id);const p=getPos(d);act.off={x:w.x-p.x,y:w.y-p.y};}
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(act?.kind==='pinch'){doPinch();return;}
  if(!act||act.pid!==e.pointerId)return;
  if(act.plan){planMove(e);return;}
  if(act.v3){const dx=e.clientX-act.sx,dy=e.clientY-act.sy;if(!act.moved&&Math.hypot(dx,dy)<7)return;act.moved=true;if(act.pan){V.tx=act.v0.tx+dx;V.ty=act.v0.ty+dy;applyView();return;}R3.yaw=act.yaw0-dx*.4;R3.pitch=clamp(act.pitch0+dy*.3,18,78);req3();return;}
  const dx=e.clientX-act.sx,dy=e.clientY-act.sy;
  if(!act.moved){if(Math.hypot(dx,dy)<7)return;act.moved=true;
    if(act.kind==='lever'||act.kind==='test')act.kind='item';
    if(act.kind==='item'){const d=byId(act.id);if(d.mount){const p=getPos(d);d.x=p.x;d.y=p.y;d.mount=null;}}}
  const w=toWorld(e.clientX,e.clientY);
  if(act.kind==='bg'||act.kind==='wire'){V.tx=act.v0.tx+dx;V.ty=act.v0.ty+dy;applyView();}
  else if(act.kind==='term'&&MEAS){act.kind='bg';}
  else if(act.kind==='term'){const A=termAbs(act.key);temp.setAttribute('d',`M${A.x},${A.y} L${w.x},${w.y}`);}
  else if(act.kind==='item'){const d=byId(act.id);d.x=w.x-act.off.x;d.y=w.y-act.off.y;GH=TYPES[d.type].rail?findMount(d):null;req();}
});
function endPtr(e,cancel){
  ptrs.delete(e.pointerId);
  if(act?.kind==='pinch'){if(!ptrs.size){act=null;if(VIEW==='3d'&&R3.k0){R3.ui=clamp(1/Math.sqrt(V.k/R3.k0),.45,1.3);render3d();}}return;}
  if(!act||act.pid!==e.pointerId)return;const a=act;act=null;
  if(a.plan){planUp(a,e,cancel);return;}
  if(a.v3){if(a.moved&&!a.pan){snap3();return;}if(!a.moved&&!cancel){S.sel=a.kind==='p3dev'?{kind:'item',id:a.id}:a.kind==='p3wall'?{kind:'wall',room:a.id,i:+a.i}:a.kind==='p3room'?{kind:'room',id:a.id}:a.kind==='p3riser'?{kind:'riser',id:a.id}:null;render();renderPanel();}return;}
  if(cancel){temp.setAttribute('d','');if(a.kind==='item'&&a.moved)dropItem(a.id);return;}
  if(!a.moved){onTap(a);return;}
  if(a.kind==='term'){temp.setAttribute('d','');const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-kind="term"]');if(el&&el.dataset.key!==a.key)connect(a.key,el.dataset.key);else render();}
  else if(a.kind==='item')dropItem(a.id);
}
function dropItem(id){const d=byId(id);if(d&&TYPES[d.type].rail){const m=findMount(d);if(m)d.mount={enc:m.enc,rail:m.rail,slot:m.slot};}GH=null;changed(false);}
svg.addEventListener('pointerup',e=>endPtr(e,false));
svg.addEventListener('pointercancel',e=>endPtr(e,true));
function startPinch(){if(act){temp.setAttribute('d','');if(act.plan){if(act.moved&&['pdev','proom','pcorner'].includes(act.kind))changed(false);}else if(act.kind==='item'&&act.moved)dropItem(act.id);}
  const [a,b]=[...ptrs.values()];const r=svg.getBoundingClientRect();const mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
  act={kind:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y)||1,k0:V.k,wm:{x:(mx-V.tx)/V.k,y:(my-V.ty)/V.k}};}
function doPinch(){const v=[...ptrs.values()];if(v.length<2)return;const [a,b]=v;const r=svg.getBoundingClientRect();const mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
  const k=clamp(act.k0*Math.hypot(a.x-b.x,a.y-b.y)/act.d0,.2,3);V.k=k;V.tx=mx-act.wm.x*k;V.ty=my-act.wm.y*k;applyView();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)));},{passive:false});

function fit(){if(VIEW==='plan'){fitPlan();return;}if(VIEW==='3d'){fit3d();return;}if(!S.items.length){V.k=1;V.tx=40;V.ty=30;applyView();return;}let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const d of S.items){const p=getPos(d),s=sz(d);x0=Math.min(x0,p.x);y0=Math.min(y0,p.y-20);x1=Math.max(x1,p.x+s.w);y1=Math.max(y1,p.y+s.h+(d.type==='hak'?75:24));}
  for(const w of S.wires){const A=termAbs(w.a),B=termAbs(w.b);if(!A||!B)continue;const c=Math.min(160,Math.max(34,Math.hypot(A.x-B.x,A.y-B.y)*.35))*.75;for(const P of [A,B]){y0=Math.min(y0,P.side==='top'?P.y-c:P.y);y1=Math.max(y1,P.side==='bot'?P.y+c:P.y);}}
  y0-=56;y1+=50;const r=svg.getBoundingClientRect();const pw=$('#panel').style.display==='block'&&innerWidth>=900?380:0;const ph=$('#panel').style.display==='block'&&innerWidth<900?r.height*.47:0;
  const gl=G&&innerWidth>=900?450:0,gtp=G&&innerWidth<900?($('#guide').offsetHeight||0)+16:0;const W=r.width-pw-gl-40,H=r.height-ph-gtp-40;V.k=clamp(Math.min(W/(x1-x0),H/(y1-y0)),.2,1.6);V.tx=gl+20+(W-(x1-x0)*V.k)/2-x0*V.k;V.ty=gtp+20+(H-(y1-y0)*V.k)/2-y0*V.k;applyView();}
function centerOn(d){const p=getPos(d),s=sz(d);const r=svg.getBoundingClientRect();const sx=V.tx+(p.x+s.w/2)*V.k,sy=V.ty+(p.y+s.h/2)*V.k;
  if(sx<30||sx>r.width-30||sy<30||sy>r.height*.5){V.tx+=r.width/2-sx;V.ty+=r.height*.3-sy;applyView();}}

function onTap(a){
  if(a.kind==='bg'){S.sel=null;pend=null;render();renderPanel();return;}
  if(a.kind==='term'&&MEAS){measTap(a.key);return;}
  if(a.kind==='term'){if(pend&&pend!==a.key){const p=pend;pend=null;connect(p,a.key);}else if(pend===a.key){pend=null;render();}else{pend=a.key;render();toast('Jetzt den zweiten Anschluss antippen.','info',2200);}return;}
  if(a.kind==='wire'){S.sel={kind:'wire',id:a.id};pend=null;render();renderPanel();return;}
  const d=byId(a.id);if(!d)return;S.sel={kind:'item',id:d.id};pend=null;
  if(a.kind==='lever'){toggleDev(d);return;}
  if(a.kind==='test'){fiTest(d);return;}
  render();renderPanel();if(innerWidth<900)centerOn(d);
}
function connect(a,b){if(a===b){render();return;}if(S.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a))){render();return;}
  const ra=termOf(a).t.role,rb=termOf(b).t.role;let color='braun';for(const r of ROLEPRIO)if(ra===r||rb===r){color=RC[r];break;}
  const nw={id:'w'+(S.nid++),a,b,color};S.wires.push(nw);if(G){const st=GSTEPS[G.i];G.note=st&&st.a&&!wireFits(nw,st)?'Diese Verbindung gehört nicht zu diesem Schritt. Mit „↶ Zurück“ nimmst du sie wieder weg.':'';}changed();}
function toggleDev(d){if(d.type==='herd'){d.on=!d.on;changed();return;}d.on=!d.on;if(d.on)d.tripped=null;changed();}
function fiTest(d){if(!d.on){toast(`${esc(nm(d))} ist bereits aus. Erst wieder einschalten.`,'info');renderPanel();return;}

  trip(units().find(u=>u.id===d.id+'#'),'Prüftaste',`<b>Prüftaste gedrückt</b>${esc(nm(d))} hat ausgelöst – er funktioniert. Die Taste erzeugt intern einen künstlichen Fehlerstrom.`,'ok');changed();}
function touch(d){const n=buildNets();const k=d.id+':PE';

  if(f){trip(f,'Fehlerstrom',`<b>${esc(uName(f))} hat ausgelöst</b>Du hast das Gehäuse von ${esc(nm(d))} berührt. Strom floss durch deinen Körper zur Erde, nicht über N zurück. Der FI hat das in ca. 20–40 ms erkannt. Du bist geschützt.`,'warn');changed();}
  else toast(`<b>Lebensgefahr</b>Das Gehäuse von ${esc(nm(d))} steht unter 230 V: kein Schutzleiter angeschlossen und kein FI im Stromkreis. Der Strom fließt ungebremst durch den Körper. Genau dafür gibt es PE und FI.`,'danger',12000);}
function delItem(d){delete S.plan.pos[d.id];delete S.plan.z[d.id];S.wires=S.wires.filter(w=>!w.a.startsWith(d.id+':')&&!w.b.startsWith(d.id+':'));
  if(TYPES[d.type].enclosure)for(const c of S.items)if(c.mount?.enc===d.id){const p=getPos(c);c.x=p.x;c.y=p.y;c.mount=null;}
  S.items=S.items.filter(i=>i!==d);S.sel=null;changed();}
function addType(type){const ty=TYPES[type];const d=newItem(type);let where='';
  if(ty.rail){const pref=ty.home||'uv';const encs=[...S.items.filter(i=>i.type===pref),...S.items.filter(i=>TYPES[i.type].enclosure&&i.type!==pref)];
    for(const e of encs){const m=ty.overlay?{enc:e.id,rail:0,slot:0}:firstFree(e,teOf(d));if(m){d.mount=m;where=e.label||TYPES[e.type].name;break;}}}

  if(ty.unit&&ty.unit!=='sw'){if(d.tripped)return{c:'red',t:`Ausgelöst: ${d.tripped}`};if(!d.on)return{c:'sub',t:'Ausgeschaltet'};

  if(d.type==='schalter'||(d.type==='kombi'&&!RT.powered.get(d.id)))return d.on?{c:'ok',t:'Ein – Kontakt geschlossen'}:{c:'sub',t:'Aus – L unterbrochen'};
  if(ty.loads){const pw=RT.powered.get(d.id)||[];if(RT.housing.has(d.id))return{c:'red',t:'Gehäuse steht unter Spannung!'};

function openHelp(){modal(`<div class="mh"><h2>Hilfe</h2><button class="btn" data-act="mclose">Schließen</button></div><div class="help">
<h3>Einstieg</h3><ul><li><b>Geführt aufbauen</b> (unter „Mehr“): Schritt für Schritt einen Lichtkreis verdrahten. Die zwei Anschlüsse jedes Schritts leuchten auf.</li><li><b>Weg des Stroms</b>: Lampe, Steckdose oder Herd antippen – der Weg vom Hausanschluss bis zum Verbraucher wird hervorgehoben.</li><li>Die großen Zahlen 1–4 auf der Fläche zeigen die Reihenfolge: Hausanschluss → Zählerschrank → Unterverteilung → Verbraucher.</li></ul>
<h3>Grundriss</h3><ul><li>Oben auf <b>Grundriss</b> umschalten. Unten wählst du das Werkzeug: <b>Raum ▭</b> aufziehen (rastet auf 0,5 m) oder <b>Raum mit Ecken</b> für jede Form, Ecke für Ecke.</li><li>Raum antippen: Name, Raumart und Maße ändern. Ecken ziehen ändert die Form.</li><li><b>Geräte</b> zeigt alles, was noch nicht im Grundriss steht. Ein Gerät, das du in einen Raum ziehst, bekommt diesen Raum automatisch.</li><li><b>Kabelkanal</b> und <b>Leitung</b> zeichnest du Punkt für Punkt. Eine Leitung ordnest du einer Sicherung zu, ihre Länge geht in die Doku.</li><li><b>Raum</b>: Form wählen (Rechteck, L, U, T) und Maße eintragen. Griff in der Wandmitte ziehen verschiebt eine Wand. Eine Wand antippen: Wandansicht, Tür, Fenster, Wand teilen.</li><li><b>Wandansicht</b>: Blick von innen auf die Wand mit Installationszonen. Geräte auf Höhe und Abstand ziehen oder Maße eintippen.</li><li><b>3D</b>: oben umschalten. Drehen in 90°-Schritten, eine oder alle Etagen.</li><li><b>Etagen</b>: Oben links wechselst du zwischen Keller, EG, OG … Unter „Etagen“ legst du weitere an und stellst die Geschosshöhe ein. Die Etage darunter scheint blass durch.</li><li><b>Steigleitung</b>: Stelle antippen, an der die Leitung durch die Decke geht, dann Ziel-Etage wählen. Zeichnest du eine Leitung auf beiden Etagen bis zu diesem Symbol, zählt die Höhe automatisch zur Länge.</li><li><b>Gebäude</b> zeigt alle Etagen von der Seite – mit Hausanschluss, Verteilungen und Steigleitungen.</li><li>Die Raumart bringt Regeln mit, z. B. Bad oder Stall. „Prüfen“ meldet fehlende FI oder zu niedrige Schutzart.</li></ul>
<h3>Aufbauen</h3><ul><li><b>Bauteile</b> antippen und Gerät wählen. Hutschienengeräte rasten automatisch ein: SLS, Zähler und PEN-Aufteilung im Zählerschrank, der Rest in der Unterverteilung.</li><li>Bauteil ziehen zum Verschieben. Über einer Hutschiene zeigt ein blauer Rahmen, wo es einrastet. Ziehst du einen Schrank, wandert alles darin mit.</li></ul>
<h3>Verbinden</h3><ul><li>Vom Anschluss (Punkt) zum anderen Anschluss ziehen – oder ersten Punkt antippen, dann den zweiten.</li><li>Die Aderfarbe wird passend gewählt. Leitung antippen zum Ändern oder Löschen.</li><li>Gelb leuchtende Punkte und Leitungen führen Spannung. Weiße laufende Striche zeigen, wo Strom fließt.</li></ul>
<h3>Schalten und Fehler</h3><ul><li>Hebel antippen schaltet ein und aus. Ausgelöste Geräte zeigen ein rotes Ausrufezeichen.</li><li>Bei Lampe, Steckdose und Herd kannst du Kurzschluss und Körperschluss auslösen. Bei der Steckdose wählst du die Last, damit testest du Überlast.</li><li><b>Prüfen</b> findet typische Verdrahtungsfehler.</li></ul>
<h3>Fehler sofort sehen</h3><ul><li>Nach jedem Schritt wird geprüft. Ein Fehler wird sofort gemeldet – mit Grund – und das Teil rot markiert. Orange gestrichelt heißt: noch unvollständig.</li><li>Der Knopf oben zeigt den Stand: grün „Alles korrekt“, rot mit Anzahl der Fehler. Antippen zeigt die Liste.</li></ul>
<h3>Messen und Rückgängig</h3><ul><li><b>Messen</b> (unter „Mehr“): zwei Anschlüsse antippen, das Messgerät zeigt 0, 230 oder 400 V – wie ein zweipoliger Spannungsprüfer.</li><li><b>↶ Zurück</b> nimmt den letzten Schritt zurück.</li></ul>
<h3>Dokumentation</h3><ul><li><b>Doku</b>: Kundendaten eintragen, Räume und Kleinmaterial ergänzen. Stromkreisliste, Materialliste und Schaltplan entstehen automatisch.</li><li>Leitungstyp und Länge trägst du bei der jeweiligen Sicherung ein, Räume beim Verbraucher.</li><li><b>Drucken / PDF</b> erzeugt das Dokument, <b>Materialliste CSV</b> öffnet sich in Excel.</li></ul>
<h3>Ansicht, Speichern, Teilen</h3><ul><li>Zwei Finger: zoomen. Leere Fläche ziehen: verschieben.</li><li>Gespeichert wird automatisch auf diesem Gerät. <b>Mehr → Projekt → Exportieren</b> sichert einen Aufbau als Datei, z. B. pro Kunde.</li><li><b>Mehr → Teilen</b> zeigt den Link zur Webseite.</li></ul>
<h3>Vereinfachungen</h3><ul><li>Auslösezeiten bei Überlast sind gerafft. Ströme werden aus der Nennleistung berechnet, Leitungsquerschnitte und Schleifenimpedanz sind nicht simuliert.</li><li>Lernwerkzeug: Arbeiten am HAK, Zählerschrank und an der Unterverteilung gehören in die Hände einer Elektrofachkraft.</li></ul></div>`);}

function toast(msg,lvl='info',ms){const t=document.createElement('div');t.className='toast '+lvl;t.innerHTML=msg+'<button class="x" aria-label="Schließen">×</button>';
  t.querySelector('.x').onclick=()=>t.remove();const box=$('#toasts');box.appendChild(t);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>t.remove(),ms||(lvl==='danger'?12000:lvl==='info'?3500:8000));}

const LSK='uv-baukasten-v1';
function snapshot(){if(VIEW==='plan')VS.plan={k:V.k,tx:V.tx,ty:V.ty};else VS.schema={k:V.k,tx:V.tx,ty:V.ty};return{items:S.items,wires:S.wires,nid:S.nid,rooms:S.rooms,doc:S.doc,extras:S.extras,plan:S.plan,v:VS.schema,vp:VS.plan,t:Date.now()};}
function saveLocal(){try{localStorage.setItem(LSK,JSON.stringify(snapshot()));}catch(_){}}
function loadData(o){if(!o||!Array.isArray(o.items)||!Array.isArray(o.wires))return false;
  S={items:o.items.filter(i=>TYPES[i.type]),wires:o.wires,nid:o.nid||1,sel:null,rooms:Array.isArray(o.rooms)?o.rooms:[],doc:o.doc&&typeof o.doc==='object'?o.doc:{},extras:Array.isArray(o.extras)?o.extras:[],plan:o.plan&&Array.isArray(o.plan.rooms)?normPlan(o.plan):emptyPlan()};S.wires=S.wires.filter(w=>termOf(w.a)&&termOf(w.b));if(o.vp)VS.plan=o.vp;
  for(const d of S.items){const def=newItem(d.type,{id:'tmp'});for(const k in def)if(d[k]===undefined)d[k]=def[k];}S.nid=Math.max(S.nid,...S.items.map(i=>+i.id.slice(1)+1),...S.wires.map(w=>+w.id.slice(1)+1),1);
  OL={};fillRooms();simulate();live(true);if(o.v){Object.assign(V,o.v);applyView();}else fit();render();renderPanel();histReset();return true;}
let artifactCap=null,dlCap=null;
(async()=>{try{if(window.claude?.use){artifactCap=await window.claude.use('artifact');dlCap=await window.claude.use('downloads');}}catch(_){}})();
async function savePage(){
  if(!artifactCap){saveLocal();toast('Dauerhaftes Speichern ist hier nicht verfügbar. Der Aufbau ist in diesem Browser gesichert. Für andere Geräte: Exportieren.','warn');return;}
  const json=JSON.stringify(snapshot()).replace(/</g,'\\u003c');
  const b=SRC_PARTS.b.replace(/(<script type="application\/json" id="saved"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,c)=>a+json+c);
  const html=`<!DOCTYPE html>\n<html lang="de">\n<head data-k>\n${SRC_PARTS.h}\n</head>\n<body data-k>\n${b}\n</body>\n</html>`;
  try{saveLocal();await artifactCap.publish(html);toast('Gespeichert.','ok');}
  catch(err){const c=err?.code||'';toast(c==='conflict'?'Die Seite wurde inzwischen woanders geändert und lädt neu. Bitte erneut speichern.':c==='not_granted'||c==='not_writer'?'Nur die Besitzerin oder der Besitzer der Seite kann speichern. Nutze Exportieren.':'Speichern fehlgeschlagen. Der Aufbau ist in diesem Browser gesichert.','warn');}}
function fname(){return (S.doc.kunde||'Unterverteilung').trim().replace(/[^\wäöüÄÖÜß-]+/g,'_')||'Unterverteilung';}
async function exportFile(){saveFile(`Aufbau_${fname()}.json`,JSON.stringify(snapshot(),null,1),'application/json');}
async function saveFile(name,data,mime){if(dlCap){try{await dlCap.save({filename:name,data});}catch(_){toast('Speichern abgebrochen.','info');}return;}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);}catch(_){toast('Download ist hier nicht möglich.','warn');}}
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(loadData(o)){saveLocal();closeModal();toast('Importiert.','ok');}else toast('Die Datei passt nicht.','warn');}catch(_){toast('Die Datei konnte nicht gelesen werden.','warn');}e.target.value='';});
let sT=0;function changed(sim=true){VER++;if(sim)simulate();live();guideUpdate();render();renderPanel();histPush();if(MEAS)showMeter();clearTimeout(sT);sT=setTimeout(saveLocal,400);}

function exampleHouse(){S={items:[],wires:[],nid:1,rooms:['Flur','Küche'],doc:S.doc||{},extras:[],plan:emptyPlan()};VSET('schema');OL={};pend=null;LIVEQ=true;G=null;FREE=false;guideUpdate();
  const A=(t,p)=>{const d=newItem(t,p);S.items.push(d);return d;};const W=(a,ta,b,tb,color)=>{const ka=a.id+':'+ta,kb=b.id+':'+tb;let c=color;if(!c){const ra=termOf(ka).t.role,rb=termOf(kb).t.role;for(const r of ROLEPRIO)if(ra===r||rb===r){c=RC[r];break;}}S.wires.push({id:'w'+(S.nid++),a:ka,b:kb,color:c||'braun'});};
  const hak=A('hak',{x:40,y:100}),zs=A('zs',{x:320,y:40}),uv=A('uv',{x:640,y:40});
  const sls=A('sls',{mount:{enc:zs.id,rail:0,slot:0}}),pen=A('pen',{mount:{enc:zs.id,rail:0,slot:5}}),z=A('zaehler',{mount:{enc:zs.id,rail:1,slot:2}});
  const spd=A('spd',{mount:{enc:uv.id,rail:0,slot:0}}),fi=A('fi4',{mount:{enc:uv.id,rail:0,slot:6},label:'FI 1'});
  const lsS=A('ls1',{mount:{enc:uv.id,rail:1,slot:0},rating:16,label:'Steckdose'}),lsL=A('ls1',{mount:{enc:uv.id,rail:1,slot:2},rating:10,label:'Licht'}),ls3=A('ls3',{mount:{enc:uv.id,rail:1,slot:5},rating:16,label:'Herd'});
  const nk=A('nk',{mount:{enc:uv.id,rail:2,slot:0}}),pk=A('pek',{mount:{enc:uv.id,rail:2,slot:6}});
  const sch=A('schalter',{x:560,y:700,label:'Schalter Flur',room:'Flur'}),lam=A('lampe',{x:680,y:700,label:'Lampe Flur',room:'Flur'}),sd=A('steckdose',{x:830,y:700,label:'Steckdose Küche',load:2000,room:'Küche'}),herd=A('herd',{x:980,y:700,label:'Herd',room:'Küche'});
  lsS.len=14;lsL.len=9;ls3.len=11;sls.len=6;
  W(hak,'L1',sls,'i1');W(hak,'L2',sls,'i2');W(hak,'L3',sls,'i3');W(hak,'PEN',pen,'PEN');
  ['1','2','3'].forEach(n=>W(sls,'o'+n,z,'i'+n));W(pen,'N',z,'iN');
  ['1','2','3','N'].forEach(n=>W(z,'o'+n,fi,'i'+n));['1','2','3','N'].forEach(n=>W(fi,'i'+n,spd,'i'+n));W(spd,'pe',pk,'t0');W(pen,'PE',pk,'t1');
  W(fi,'oN',nk,'t0');W(fi,'o1',lsS,'i');W(fi,'o2',lsL,'i');W(fi,'o1',ls3,'i1');W(fi,'o2',ls3,'i2');W(fi,'o3',ls3,'i3');
  W(lsS,'o',sd,'L');W(nk,'b0',sd,'N');W(pk,'b0',sd,'PE');
  W(lsL,'o',sch,'L');W(sch,'LS',lam,'L','schwarz');W(nk,'b1',lam,'N');W(pk,'b1',lam,'PE');
  ['1','2','3'].forEach(n=>W(ls3,'o'+n,herd,'L'+n));W(nk,'b2',herd,'N');W(pk,'b2',herd,'PE');
  S.sel=null;closeModal();fillRooms();changed();fit();
  toast('<b>Beispiel: ganzes Haus</b>Licht, Steckdose und Herd. Tippe einen Verbraucher an – sein Weg leuchtet auf.','ok',6000);}

  if(withWires)for(const st of GSTEPS)if(st.a){const ka=stepKey(st.a,st.b),kb=stepKey(st.b,st.a);const ra=termOf(ka).t.role,rb=termOf(kb).t.role;let c='braun';for(const r of ROLEPRIO)if(ra===r||rb===r){c=RC[r];break;}if(st.b[0]==='lam'&&st.b[1]==='L')c='schwarz';S.wires.push({id:'w'+(S.nid++),a:ka,b:kb,color:c});}}

let PATH=null,PATHKEY='';
function pathCheck(){const s=S.sel;const key=(s&&s.kind==='item'?s.id:'')+'|'+VER;if(key===PATHKEY)return;PATHKEY=key;PATH=null;
  if(!s||s.kind!=='item')return;const d=byId(s.id);if(!d||!TYPES[d.type].loads)return;
  const base=buildNets({structural:true,noFaults:true});const Ls=TYPES[d.type].terms.filter(t=>/^L/.test(t.role)).map(t=>d.id+':'+t.id);const N=d.id+':N',PE=d.id+':PE';
  if(!Ls.some(k=>base.get(k).phases.size)||!base.get(N).ground)return;
  const res={L:[],N:[],PE:[]};
  for(const w of S.wires){const n2=buildNets({structural:true,noFaults:true,excludeWire:w.id});
    if(Ls.some(k=>base.get(k).phases.size&&!n2.get(k).phases.size))res.L.push(w.id);
    if(!n2.get(N).ground)res.N.push(w.id);if(base.get(PE).ground&&!n2.get(PE).ground)res.PE.push(w.id);}
  const order=(ids,start)=>{const adj={};for(const id of ids){const w=S.wires.find(x=>x.id===id);const a=w.a.split(':')[0],b=w.b.split(':')[0];(adj[a]||(adj[a]=[])).push(b);(adj[b]||(adj[b]=[])).push(a);}
    if(!adj[start])return[];const seen=[start],q=[start];while(q.length){const x=q.shift();for(const y of adj[x])if(!seen.includes(y)){seen.push(y);q.push(y);}}return seen.map(id=>nm(byId(id)));};
  const hak=S.items.find(x=>x.type==='hak');const lOrder=hak?order(res.L,hak.id):order(res.L,d.id).reverse();
  const txt=[];if(lOrder.length)txt.push(['Hin über L:',lOrder.join(' → ')]);const nO=order(res.N,d.id);if(nO.length)txt.push(['Zurück über N:',nO.join(' → ')]);
  const pO=order(res.PE,d.id);txt.push(['Schutzleiter PE:',pO.length?pO.join(' → '):'nicht angeschlossen']);
  const wires=new Set([...res.L,...res.N,...res.PE]);const devs=new Set([d.id]);for(const id of wires){const w=S.wires.find(x=>x.id===id);devs.add(w.a.split(':')[0]);devs.add(w.b.split(':')[0]);}
  PATH={for:d.id,wires,devs,txt};}

function measTap(k){if(!MA||MB){MA=k;MB=null;}else if(k!==MA)MB=k;showMeter();render();}
function volt(a,b){const n=buildNets();if(n.find(a)===n.find(b))return{v:0,t:'Beide Punkte sind direkt miteinander verbunden.'};
  const pot=p=>p.phases.size===1&&!p.ground?[...p.phases][0]:(p.ground&&!p.phases.size?'G':null);const pa=pot(n.get(a)),pb=pot(n.get(b));
  if(!pa||!pb)return{v:null,t:'Kein Messwert: Mindestens ein Punkt hat keine Verbindung zum Netz (Leiter offen oder abgeschaltet).'};
  if(pa==='G'&&pb==='G')return{v:0,t:'N bzw. PE gegeneinander – beide liegen auf Erdpotential.'};
  if(pa==='G'||pb==='G')return{v:230,t:`Außenleiter ${pa==='G'?pb:pa} gegen N/PE: Strangspannung.`};
  if(pa===pb)return{v:0,t:`Beide Punkte hängen an ${pa}.`};
  return{v:400,t:`${pa} gegen ${pb}: verkettete Spannung (230 V × √3 ≈ 400 V).`};}
function showMeter(){const m=$('#meter');if(!MEAS){m.style.display='none';return;}m.style.display='block';

  if(MA&&!termOf(MA))MA=null;if(MB&&!termOf(MB))MB=null;
  if(!MA)h='<div class="t" style="margin:6px 0">Tippe den ersten Anschluss an (Messspitze A).</div>';
  else if(!MB)h=`<div class="t" style="margin:6px 0">A: ${esc(tn(MA))}<br>Jetzt den zweiten Anschluss antippen (B).</div>`;
  else{const r=volt(MA,MB);h=`<div class="v">${r.v===null?'– – –':r.v+' V'}</div><div class="t">${esc(r.t)}</div><div class="p">A: ${esc(tn(MA))}<br>B: ${esc(tn(MB))}</div>`;}
  m.innerHTML=`<div style="font-size:11.5px;font-weight:800;color:#8e8e93;letter-spacing:.06em">SPANNUNGSPRÜFER</div>${h}<div style="display:flex;gap:6px"><button class="btn" data-act="measnew">Neu messen</button><button class="btn" data-act="measoff">Beenden</button></div>`;}

  const fis=U.filter(u=>u.kind==='fi');const els=loadEls(true);
  return ls.map((u,i)=>{const d=u.d;const n2=nu(u.id);const inK=d.id+':'+(d.type==='ls1'?'i':d.type==='ls3'?'i1':'iL');

  const left=da<=db?a:b,right=da<=db?b:a;return{a,b,L,n,left,right,dir:[(right[0]-left[0])/L,(right[1]-left[1])/L]};}
const along=(F,p)=>(p[0]-F.left[0])*F.dir[0]+(p[1]-F.left[1])*F.dir[1];

function openWall0(o){const r=room(o.room);if(!r)return null;let best=null,bd=.6;for(let i=0;i<r.pts.length;i++){const a=r.pts[i],b=r.pts[(i+1)%r.pts.length];if(Math.hypot(b[0]-a[0],b[1]-a[1])<.05)continue;const d=segDist([o.x,o.y],a,b);if(d<bd){bd=d;best=i;}}if(best==null)return null;const F=wallFrame(r,best);return{r,i:best,F,s:along(F,[o.x,o.y])};}
const devsOnWall=(r,i)=>{const F=wallFrame(r,i);if(!F)return[];return S.items.filter(d=>{const p=S.plan.pos[d.id];if(!p||p[2]!==r.fl||!WALLMOUNT.has(d.type))return false;const w=wallOfPoint(p,r.fl,.4);return w&&w.r.id===r.id&&w.i===i;});};
const opsOnWall=(r,i)=>S.plan.openings.filter(o=>{const w=openWall0(o);return w&&w.r.id===r.id&&w.i===i;});
function snapToWall(id){const d=byId(id),p=S.plan.pos[id];if(!d||!p||!WALLMOUNT.has(d.type))return;const w=wallOfPoint(p,p[2],.45);if(!w)return;const F=wallFrame(w.r,w.i);const s=clamp(along(F,p),.05,F.L-.05);const q=fromAlong(F,s,.08);S.plan.pos[id]=[q[0],q[1],p[2]];}
function addOpening(r,i,kind,s){const F=wallFrame(r,i);if(!F)return null;const w=kind==='door'?.9:1;if(s==null){const occ=opsOnWall(r,i).map(o=>{const q=openWall0(o);return [q.s-o.w/2,q.s+o.w/2];});const free=x=>occ.every(([u,v])=>x+w/2+.1<=u||x-w/2-.1>=v);const cand=[];for(let x=w/2+.1;x<=F.L-w/2-.1+1e-9;x+=.05)cand.push(+x.toFixed(2));const ok=cand.filter(free).sort((p,q)=>Math.abs(p-F.L/2)-Math.abs(q-F.L/2));if(occ.length&&!ok.length){toast('Auf dieser Wand ist kein Platz mehr frei.','info',2500);return null;}s=ok.length?ok[0]:F.L/2;}s=clamp(s,w/2+.05,F.L-w/2-.05);const p=fromAlong(F,s,0);

/* 2) Aderzuordnung je Leitung */

    const mk=(col,fn,grp,marked)=>{const k={id:c.id+'.'+col,cable:c.id,col,fn,grp,marked:!!marked,qs:t.qs};cores.push(k);c.cores.push(k);return k;};

    if(c.needN){if(take('bl'))mk('bl','N','N');else W('fehler',`„${c.kurz}“ hat keine blaue Ader für N`,`Diese Leitung braucht einen Neutralleiter. ${c.typ} hat keine blaue Ader. Nimm NYM-J 3× oder 5×.`,['c:'+c.id]);}
    const miss=[];
    for(const g of c.fnL){const col=['br','sw','gr','bl'].find(x=>avail.includes(x));if(!col){miss.push(g);continue;}take(col);mk(col,g[0]==='L'?'L':g[0],g,col==='bl');}
    if(miss.length)W('fehler',`„${c.kurz}“ hat zu wenig Adern`,`${c.typ} reicht nicht: Es fehlen ${miss.length} Ader(n) für ${miss.map(grpName).join(', ')}. Wähle eine Leitung mit mehr Adern, z. B. NYM-J 5×1,5.`,['c:'+c.id]);

let OUTS_CUR={};
function grpName(g){if(g==='PE')return FN.PE.name;if(g==='N')return FN.N.name;if(g==='L')return FN.L.name;

  if(g.startsWith('K:')){const [_,b,n]=g.split(':');const o=OUTS_CUR[b];return`Korrespondierende ${n} (${o?o.label:''})`;}
  return'Reserve';}
function grpKurz(g){if(g==='PE'||g==='N'||g==='L')return g;if(g.startsWith('S:')){const o=OUTS_CUR[g.slice(2)];return o?o.kurz:'S';}
  if(g.startsWith('K:')){const [_,b,n]=g.split(':');const o=OUTS_CUR[b];return(o?o.kurz:'S')+' K'+n;}return'R';}
const GRP_ORDER=g=>g==='PE'?0:g==='N'?1:g==='L'?2:g.startsWith('S:')?3:g.startsWith('K:')?4:9;

/* 3) Klemmengruppen */
function buildGroups(cores){
  const m=new Map();for(const k of cores){if(k.fn==='R')continue;if(!m.has(k.grp))m.set(k.grp,{key:k.grp,fn:k.fn,cores:[]});m.get(k.grp).cores.push(k);}
  return[...m.values()].sort((a,b)=>GRP_ORDER(a.key)-GRP_ORDER(b.key)||a.key.localeCompare(b.key));
}

/* 4) Klemmen planen (Größe, Aufteilung, Brücken) */
function planClampsHebel(groups,up){
  const clamps=[],bridges=[];let n=0;
  for(const g of groups){const N=g.cores.length;const k=N<=5?1:Math.ceil((N-2)/3);
    const cs=[...g.cores].sort((a,b)=>up(b)-up(a));const chunks=[];let rest=N;let idx=0;
    for(let i=0;i<k;i++){const br=k===1?0:(i===0||i===k-1)?1:2;const cap=5-br;const sz=Math.min(cap,Math.ceil(rest/(k-i)));chunks.push({cores:cs.slice(idx,idx+sz),br});idx+=sz;rest-=sz;}
    const ids=[];
    for(const ch of chunks){const need=Math.max(2,ch.cores.length+ch.br);const pol=HEBEL.stufen.find(s=>s>=need);const sz=HEBEL.sizes[pol];

      const cl={id:'k'+(++n),grp:g.key,art:'hebel',pol,w:sz.breite,L:sz.laenge,cores:ch.cores.map(c=>c.id),face:meanUp>=.5?'up':'down',upv:meanUp,bridges:[]};clamps.push(cl);ids.push(cl.id);}
    for(let i=0;i+1<ids.length;i++){const b={id:'br'+bridges.length,grp:g.key,a:ids[i],b:ids[i+1]};bridges.push(b);}

function planClampsLuester(groups,up){
  const clamps=[],bridges=[];let n=0;

const TR={top:'left',left:'top',bottom:'right',right:'bottom'};
function trBox(box){return Object.assign({},box,{innen:[box.innen[1],box.innen[0]],einf:{top:box.einf.left,left:box.einf.top,bottom:box.einf.right,right:box.einf.bottom}});}

      const m={};for(const id of ids){const c=M.cableById[id];const v=c.cores.filter(k=>G.core[k.id]&&!G.core[k.id].res).map(k=>G.core[k.id].P[hz?0:1]);m[id]=v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
      ids.sort((a,b)=>m[a]-m[b]);pickEntries(s,ids.map(id=>m[id]));}
    G=computeGeo(M,box,st);baryClamps(G);G=computeGeo(M,box,st);
  }

  // Varianten der Reihenzuordnung (Hebel): alle Kombinationen bis 7 Klemmen, sonst Stichprobe
  let variants=[clone(st)];
  if(M.klemme==='hebel'){const ids=M.clamps.map(c=>c.id),n=ids.length;const wOf=list=>list.reduce((s,id)=>s+M.clampById[id].w,0)+3*Math.max(0,list.length-1);
    const masks=[];if(n<=7)for(let m=0;m<(1<<n);m++)masks.push(m);else{let seed=7;for(let i=0;i<90;i++){seed=(seed*1103515245+12345)&0x7fffffff;masks.push(seed%(1<<n));}}
    for(const m of masks){const up=ids.filter((_,i)=>m>>i&1),dn=ids.filter((_,i)=>!(m>>i&1));if(wOf(up)>avail||wOf(dn)>avail)continue;const v=clone(st);v.rows.up=up;v.rows.down=dn;v.face={};variants.push(v);}}
  if(quick)variants=variants.filter((_,i)=>i%Math.max(1,Math.floor(variants.length/10))===0);
  let cands=[];
  for(const v of variants){for(const c of M.clamps)c.face=v.rows.up.includes(c.id)?'up':v.rows.down.includes(c.id)?'down':c.face;const r=refine(v);if(r)cands.push(r);}
  if(!cands.length)return null;
  cands.sort((a,b)=>a.G.cost.score-b.G.cost.score);if(globalThis.DEBUG)console.log("variants",variants.length,"cands",cands.length,cands.slice(0,5).map(c=>c.G.cost.cross+"/"+c.G.cost.over+":"+c.st.rows.up.join(",")));
  const top=cands.slice(0,quick?1:3);let G=null;
  let winner=null;
  for(const c0 of top){Object.assign(st,clone(c0.st));for(const c of M.clamps)c.face=st.rows.up.includes(c.id)?'up':st.rows.down.includes(c.id)?'down':c.face;const r=localSearch(computeGeo(M,box,st));if(!winner||r.G.cost.score<winner.G.cost.score)winner=r;}

  function localSearch(G){
  let best=G,bestSt=clone(st);

  for(let pass=0;pass<(quick?1:3);pass++){let imp=false;
    for(const r of ['up','down','mid'])for(let i=0;i+1<bestSt.rows[r].length;i++){const s2=clone(bestSt);[s2.rows[r][i],s2.rows[r][i+1]]=[s2.rows[r][i+1],s2.rows[r][i]];if(tryS(s2))imp=true;}
    for(const s of SIDES)for(let i=0;i+1<bestSt.order[s].length;i++){const s2=clone(bestSt);const o=s2.order[s];[o[i],o[i+1]]=[o[i+1],o[i]];const e=o.map(id=>s2.entry[id]).sort((a,b)=>a-b);o.forEach((id,j)=>s2.entry[id]=e[j]);if(tryS(s2))imp=true;}

      for(let j=0;j<ids.length;j++)for(const dlt of[-1,1]){const s2=clone(bestSt);const ne=s2.entry[ids[j]]+dlt;if(ne<0||ne>=k)continue;if(ids.some((id,q)=>q!==j&&s2.entry[id]===ne))continue;s2.entry[ids[j]]=ne;
        const ok=ids.every((id,q)=>q===0||s2.entry[ids[q-1]]<s2.entry[id]);if(ok&&tryS(s2))imp=true;}}

}

/* ---------------------------------------------------------------------
   6) boxModel(cfg) → komplettes Modell
   --------------------------------------------------------------------- */
function boxModel(cfg){
  const warnings=[];const W=(lvl,titel,warum,refs=[])=>warnings.push({lvl,titel,warum,refs});
  const M={cfg,klemme:cfg.klemme||'hebel',warnings};
  const ex=expand(cfg,W);OUTS_CUR=ex.outMap;M.outMap=ex.outMap;M.outs=ex.outs;M.cables=ex.cables;M.cableById=Object.fromEntries(M.cables.map(c=>[c.id,c]));
  M.cores=assignCores(M.cables,W);M.coreById=Object.fromEntries(M.cores.map(k=>[k.id,k]));
  M.groups=buildGroups(M.cores);
  const nCab=M.cables.filter(c=>c.cores.length).length;
  // Dosengröße wählen
  let chosen=null,why=[];
  const cands=cfg.dose&&cfg.dose!=='auto'?[DOSEN.find(d=>d.id===cfg.dose)]:DOSEN;
  for(const box of cands){const ein=Object.values(box.einf).reduce((a,b)=>a+b,0);
    if(nCab>ein){why.push(`${box.id}: nur ${ein} Einführungen`);continue;}
    const qsx=Math.max(...M.cables.filter(c=>KABELTYPEN[c.typ]).map(c=>KABELTYPEN[c.typ].qs),0);if(qsx>box.qsMax){why.push(`${box.id}: nur bis ${String(box.qsMax).replace('.',',')} mm²`);continue;}
    if(fuell(M,box)>FUELLGRAD.max){why.push(`${box.id}: zu voll`);continue;}
    const fat=M.cables.find(c=>KABELTYPEN[c.typ]&&KABELTYPEN[c.typ].d>box.membranMaxD);if(fat){why.push(`${box.id}: Leitung zu dick`);continue;}
    const Mc=Object.assign({},M);const r=layoutBox(Mc,box);if(!r){why.push(`${box.id}: Klemmen passen nicht`);continue;}
    chosen={box,r,Mc};break;}
  if(!chosen){// Notfall: größte Dose, ohne Prüfung zeichnen
    const box=cfg.dose&&cfg.dose!=='auto'?DOSEN.find(d=>d.id===cfg.dose):DOSEN[DOSEN.length-1];
    W('fehler',cfg.dose&&cfg.dose!=='auto'?`Dose ${box.id} ist zu klein`:'Zu viel für eine Dose',`${why.join(' · ')}. ${cfg.dose&&cfg.dose!=='auto'?'Stell die Größe auf „Automatisch“ oder nimm eine größere Dose.':'Teile die Leitungen auf zwei Dosen auf (eine Leitung „Weiter zur nächsten Dose“).'} Eine volle Dose wird warm, Adern knicken und Klemmen lösen sich beim Deckel-Aufsetzen.`);
    const Mc=Object.assign({},M);let r=null;
    // Großzügig: Platz-Checks aufweichen, damit trotzdem etwas gezeichnet wird
    let fake;for(const f of[1.5,2,2.6]){fake=Object.assign({},box,{innen:[Math.round(box.innen[0]*f),Math.round(box.innen[1]*f)],einf:{top:4,right:4,bottom:4,left:4}});r=layoutBox(Mc,fake);if(r)break;}
    chosen={box:fake,r,Mc,overflow:true};}
  Object.assign(M,chosen.Mc);M.box=chosen.box;M.overflow=!!chosen.overflow;M.realBox=chosen.overflow?(cfg.dose&&cfg.dose!=='auto'?DOSEN.find(d=>d.id===cfg.dose):DOSEN[DOSEN.length-1]):chosen.box;
  M.geo=chosen.r?chosen.r.G:null;M.st=chosen.r?chosen.r.st:null;
  M.layout=M.geo?{cables:M.geo.cab,clamps:M.geo.cl,cores:M.geo.core,bridges:M.geo.br,crossings:M.geo.cost.cross,overClamp:M.geo.cost.over}:null;
  M.size={id:M.realBox.id,name:M.realBox.name,innen:M.realBox.innen,ip:M.realBox.ip,einfuehrungen:M.realBox.einfGesamt,seitlich:Object.values(M.realBox.einf).reduce((a,b)=>a+b,0),fuellgrad:Math.round(fuell(M,M.realBox)*100),belegt:nCab,adern:M.cores.length};
  checks(M,W);
  M.steps=buildSteps(M);M.material=buildMaterial(M);M.info=buildInfo(M);
  const rank={fehler:0,achtung:1,hinweis:2};warnings.sort((a,b)=>rank[a.lvl]-rank[b.lvl]);
  return M;
}

function fuell(M,box){// Flächenheuristik (App-Annahme)
  const est=M.groups.reduce((s,g)=>{const n=g.cores.length;if(M.klemme==='hebel'){const k=n<=5?1:Math.ceil((n-2)/3);const z=HEBEL.sizes[n<=2?2:n<=3?3:5];return s+k*z.breite*z.laenge;}return s+Math.max(1,Math.ceil(n/2))*LUESTER.raster*LUESTER.tiefe;},0);
  return(est+M.cores.length*FUELLGRAD.aderFlaeche)/(box.innen[0]*box.innen[1]);}
/* 7) Prüfungen */
function checks(M,W){

  for(const g of M.groups){if(g.fn==='S'){const sw=g.cores.filter(k=>M.cableById[k.cable].art==='schalter'),other=g.cores.length-sw.length;
      if(sw.length&&!other)W('achtung',`${grpName(g.key)} schaltet nichts`,'Vom Schalter kommt eine geschaltete Phase zurück, aber keine Lampe hängt daran. Wähle bei einer Lampe „geschaltet von“ diesen Schalter – oder entferne die Taste.',g.cores.map(k=>'a:'+k.id));
      if(!sw.length)W('fehler',`${grpName(g.key)} ohne Schalter`,'Lampen hängen an einem Schaltausgang, der in dieser Dose nicht vom Schalter kommt.',g.cores.map(k=>'a:'+k.id));}
    else if(g.cores.length===1&&g.fn!=='R')W('achtung',`${grpName(g.key)}: nur eine Ader`,'Diese Ader hat in der Dose kein Gegenstück. Sie wird trotzdem in eine eigene Klemme gesteckt, damit das blanke Ende isoliert ist. Prüfe, ob etwas fehlt.',g.cores.map(k=>'a:'+k.id));}
  const lampsDauer=cab.filter(c=>c.art==='lampe'&&c.fnL[0]==='L');if(lampsDauer.length)W('hinweis','Lampe ohne Schalter',`${lampsDauer.map(c=>c.kurz).join(', ')} hängt an Dauerphase und ist immer an, solange die Sicherung an ist.`,lampsDauer.flatMap(refsOf));
  const qs=[...new Set(cab.filter(c=>KABELTYPEN[c.typ]).map(c=>KABELTYPEN[c.typ].qs))];
  if(qs.length>1){const thin=cab.filter(c=>KABELTYPEN[c.typ]&&KABELTYPEN[c.typ].qs===Math.min(...qs));
    W('achtung','Querschnitt gemischt (1,5 und 2,5 mm²)',`Die Sicherung im Sicherungskasten muss die dünnste Leitung im Stromkreis schützen. Hängt 1,5 mm² an einer Dose mit 2,5-mm²-Zuleitung, richtet sich die Sicherung nach 1,5 mm² (Verlegeart und Länge entscheiden). Das mit der Elektrofachkraft klären.${M.klemme==='luester'?' Bei Lüsterklemmen: keine zwei unterschiedlich dicken Adern unter eine Schraube.':''}`,thin.flatMap(refsOf));}
  const fq=feeds[0]&&KABELTYPEN[feeds[0].typ]?KABELTYPEN[feeds[0].typ].qs:null;
  const thick=cab.filter(c=>fq&&KABELTYPEN[c.typ]&&KABELTYPEN[c.typ].qs>fq);if(thick.length)W('hinweis','Dickere Leitung hinter dünnerer Zuleitung',`${thick.map(c=>c.kurz).join(', ')} ist dicker als die Zuleitung. Das schadet nicht, bringt aber nichts: Belastbar ist nur so viel, wie die Zuleitung und ihre Sicherung erlauben.`,thick.flatMap(refsOf));
  const sd=cab.filter(c=>c.art==='steckdose');if(sd.length&&cab.some(c=>c.art==='lampe'))W('hinweis','Steckdose und Licht im selben Stromkreis','Das ist erlaubt. Nachteil: Löst die Sicherung oder der FI wegen eines Geräts an der Steckdose aus, ist auch das Licht aus. Für Steckdosen bis 32 A ist ein 30-mA-FI Pflicht.',sd.flatMap(refsOf));
  const res=M.cores.filter(k=>k.fn==='R');if(res.length)W('hinweis',`${res.length} Reserve-Ader${res.length>1?'n':''}`,`${res.map(k=>ADERFARBEN[k.col].name+' („'+M.cableById[k.cable].kurz+'“)').join(', ')}: wird nicht gebraucht. Nicht abisolieren und ordentlich in die Dose legen. Am anderen Ende genauso.`,res.map(k=>'a:'+k.id));

}

/* 8) Anleitung */
function coreLabel(M,k){const c=M.cableById[k.cable];return`${ADERFARBEN[k.col].name}${k.marked?' (markiert)':''} von „${c.kurz}“`;}
function clampTxt(M,g){const cls=M.clamps.filter(c=>c.grp===g.key);if(M.klemme==='hebel'){const s=cls.map(c=>c.pol+'-fach').join(' + ');return cls.length>1?`${cls.length===2?'zwei':cls.length} Hebelklemmen (${s}) mit ${cls.length===2?'Brücke':'Brücken'}`:`eine Hebelklemme ${s}`;}const p=cls[0].pol;return p>1?`${p} Stellen der Lüsterklemme mit Drahtbrücke`:'eine Stelle der Lüsterklemme';}
function buildSteps(M){

  S.push({titel:'Strom aus – und prüfen',text:['Sicherung des Stromkreises ausschalten und gegen Wiedereinschalten sichern (Zettel/Sperre).','Mit einem zweipoligen Spannungsprüfer an allen Adern feststellen, dass keine Spannung anliegt. Das macht die Elektrofachkraft.'],tip:'Die fünf Sicherheitsregeln gelten auch für „nur kurz eine Lampe anklemmen“.',refs:[]});
  const used=M.cables.filter(c=>L&&L.cables[c.id]);
  const entries=used.map(c=>{const g=L.cables[c.id];return`${entryName(g.side,g.ei,g.ek)}: ${c.name}`;});

  const ord=[...used].sort((a,b)=>(a.art==='zuleitung'?-1:0)-(b.art==='zuleitung'?-1:0));
  for(const c of ord){const g=L.cables[c.id];const cols=c.cores.map(k=>ADERFARBEN[k.col].name+(k.fn==='R'?' (Reserve)':''));
    S.push({titel:`„${c.kurz}“ einführen und abmanteln`,text:[`${c.typ} ${c.name} durch die Einführung ${entryName(g.side,g.ei,g.ek)} schieben.`,`Mantel so abnehmen, dass er noch ${TEXTE.mantelInDose} in die Dose ragt. Adern dabei nicht einschneiden.`,`Adern auf ${TEXTE.aderLaenge} kürzen und ${M.klemme==='hebel'?HEBEL.abisolier:LUESTER.abisolier} mm abisolieren${c.cores.some(k=>k.fn==='R')?' (Reserve-Ader nicht)':''}.`],list:[`Adern: ${cols.join(', ')}`],refs:['c:'+c.id,'e:'+c.id,...c.cores.map(k=>'a:'+k.id)]});}
  const marked=M.cores.filter(k=>k.marked);
  if(marked.length)S.push({titel:'Blaue Schaltdrähte kennzeichnen',text:['Diese blauen Adern sind hier keine Neutralleiter. Ein Ring schwarzes oder braunes Isolierband direkt am Mantel – auch am anderen Ende beim Schalter:'],list:marked.map(k=>coreLabel(M,k)),refs:marked.map(k=>'a:'+k.id)});
  const howH='Hebel ganz hochklappen, Ader bis zum Anschlag einstecken, Hebel zudrücken.';const howL='Ader bis zum Anschlag einstecken, Schraube fest anziehen.';
  for(const g of M.groups){const f=FN[g.fn];const cls=M.clamps.filter(c=>c.grp===g.key);
    let titel=g.fn==='PE'?'Schutzleiter zuerst verbinden':g.fn==='N'?'Neutralleiter verbinden':g.fn==='L'?'Dauerphase verbinden':grpName(g.key)+' verbinden';
    const brs=M.bridges.filter(b=>b.grp===g.key);
    const text=[`${g.cores.length} ${g.cores.length===1?'Ader':'Adern'} in ${clampTxt(M,g)}. ${M.klemme==='hebel'?howH:howL}`];
    if(brs.length)text.push(M.klemme==='hebel'?`Zuerst die Brücke stecken: ein ca. 6 cm langes Aderstück (gleiche Farbe, gleicher Querschnitt) verbindet die Klemmen.`:`Die Stellen mit einem kurzen Drahtstück verbinden (Brücke).`);
    if(g.fn==='PE')text.push('Der Schutzleiter kommt zuerst, damit er beim Arbeiten nie fehlt. Lass ihn etwas länger als die anderen Adern.');
    S.push({titel,text,list:g.cores.map(k=>coreLabel(M,k)),refs:[...g.cores.map(k=>'a:'+k.id),...cls.map(c=>'k:'+c.id),...brs.map(b=>'b:'+b.id)],grp:g.key});}
  const res=M.cores.filter(k=>k.fn==='R');

/* 9) Material */

function dzInfo(ref){const M=DZ.M,I=M.info[ref];if(!I)return;const el=dz('info');
  el.innerHTML=`<button class="x" data-dz="xinfo" aria-label="Schließen">×</button><h3>${esc(I.t)}</h3><div>${I.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${I.p.map(p=>`<p>${esc(p)}</p>`).join('')}`;el.style.display='block';
  let refs=[ref];if(ref.startsWith('a:')){const k=M.coreById[ref.slice(2)];const cl=M.clamps.find(c=>c.cores.includes(k.id));refs.push('c:'+k.cable);if(cl)refs.push('k:'+cl.id);}
  if(ref.startsWith('k:')){const cl=M.clampById[ref.slice(2)];refs.push(...cl.cores.map(i=>'a:'+i));M.bridges.filter(b=>b.a===cl.id||b.b===cl.id).forEach(b=>refs.push('b:'+b.id,'k:'+b.a,'k:'+b.b));}
  if(ref.startsWith('c:')||ref.startsWith('e:')){const c=M.cableById[ref.slice(2)];refs.push('c:'+c.id,'e:'+c.id,...c.cores.map(k=>'a:'+k.id));}
  DZ.focus=new Set(refs);DZ.focusKey=null;dzDraw();}
function dzHideInfo(keep){const el=dz('info');if(el)el.style.display='none';if(keep)return;if(DZ.tab==='anleitung')dzRender();else{DZ.focus=null;dzDraw();}}
(function(){const el=()=>$('#dosev');const PT=new Map();let G0=null,moved=false,downRef=null;
  const snap=()=>{const p=[...PT.values()];if(!p.length)return null;const cx=p.reduce((s,q)=>s+q[0],0)/p.length,cy=p.reduce((s,q)=>s+q[1],0)/p.length;const d=p.length>1?Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]):0;return{cx,cy,d,s:DZ.V.s,tx:DZ.V.tx,ty:DZ.V.ty};};
  document.addEventListener('DOMContentLoaded',()=>{});
  const on=(t,f,o)=>document.addEventListener(t,e=>{const sv=e.target.closest&&e.target.closest('#dz-stg');if(sv||(t!=='pointerdown'&&PT.has(e.pointerId)))f(e,sv||dz('stg'));},o);
  on('pointerdown',(e,sv)=>{e.stopPropagation();sv.setPointerCapture(e.pointerId);PT.set(e.pointerId,[e.clientX,e.clientY]);moved=PT.size>1;const r=e.target.closest('[data-ref]');downRef=r?r.dataset.ref:null;G0=snap();},true);
  on('pointermove',(e,sv)=>{if(!PT.has(e.pointerId))return;e.stopPropagation();PT.set(e.pointerId,[e.clientX,e.clientY]);const g=snap();if(!G0)return;
    if(Math.hypot(g.cx-G0.cx,g.cy-G0.cy)>6||Math.abs(g.d-G0.d)>6)moved=true;if(!moved)return;
    const rc=sv.getBoundingClientRect();const k=G0.d&&g.d?g.d/G0.d:1;const ns=Math.max(.5,Math.min(40,G0.s*k));const kk=ns/G0.s;
    DZ.V.s=ns;DZ.V.tx=(g.cx-rc.left)-((G0.cx-rc.left)-G0.tx)*kk;DZ.V.ty=(g.cy-rc.top)-((G0.cy-rc.top)-G0.ty)*kk;dzApply();},true);
  const end=e=>{if(!PT.has(e.pointerId))return;e.stopPropagation();PT.delete(e.pointerId);if(!moved&&PT.size===0){if(downRef)dzInfo(downRef);else if(dz('info')&&dz('info').style.display==='block')dzHideInfo();}G0=PT.size?snap():null;if(!PT.size)moved=false;};
  document.addEventListener('pointerup',end,true);document.addEventListener('pointercancel',end,true);
  document.addEventListener('wheel',e=>{const sv=e.target.closest&&e.target.closest('#dz-stg');if(!sv)return;e.preventDefault();e.stopPropagation();const r=sv.getBoundingClientRect();dzZoom(Math.exp(-e.deltaY*.0022),e.clientX-r.left,e.clientY-r.top);},{passive:false,capture:true});
  addEventListener('resize',()=>{if(DZ.d)dzFit();});})();
/* Doku-Abschnitt für eine Dose */
function doseDocHTML(d){const M=doseModel(d);if(!M)return'';const B=DOSE.boxBounds(M);
  const pic=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${B.x} ${B.y} ${B.w} ${B.h}" style="width:100%;max-height:520px">${DOSE.boxSVG(M,{doc:true})}</svg>`;
  let plan='';if(dzHasPlan()&&DOSE.boxPlanBounds){const P=DOSE.boxPlanBounds(M);plan=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${P.x} ${P.y} ${P.w} ${P.h}" style="width:100%;margin-top:8px">${DOSE.boxPlanSVG(M,{doc:true})}</svg>`;}
  const st=M.steps.map((s,i)=>`<li><b>${esc(s.titel)}</b>${s.text.length?' – '+esc(s.text.join(' ')):''}${s.list?`<ul>${s.list.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</li>`).join('');
  const w=M.warnings.filter(x=>x.lvl!=='hinweis').map(x=>`<li><b>${esc(x.titel)}</b> – ${esc(x.warum)}</li>`).join('');
  return `<h3>${esc(nm(d))} · ${esc(M.size.name)} mm · ${esc(dzKl(M))}</h3><div class="plan">${pic}${plan}</div><ol class="dsteps">${st}</ol>${w?`<div class="meta"><b>Zu beachten</b></div><ul>${w}</ul>`:''}`;}
